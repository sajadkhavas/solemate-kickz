name: F2 Format Export

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Format and export changed F2 files
        shell: bash
        run: |
          bunx prettier --write \
            docs/handoffs/F2-NAVIGATION-SEARCH.md \
            scripts/audit-f2-navigation-search.mjs \
            scripts/f2-browser-runner.mjs \
            scripts/test-f2-navigation-search.mjs \
            scripts/visual-qa-f2-navigation-search.mjs \
            src/components/MobileBottomNav.tsx \
            src/components/navigation/DesktopNavigation.tsx \
            src/components/navigation/MobileNavigation.tsx

          archive="$(mktemp)"
          tar -czf "$archive" \
            docs/handoffs/F2-NAVIGATION-SEARCH.md \
            scripts/audit-f2-navigation-search.mjs \
            scripts/f2-browser-runner.mjs \
            scripts/test-f2-navigation-search.mjs \
            scripts/visual-qa-f2-navigation-search.mjs \
            src/components/MobileBottomNav.tsx \
            src/components/navigation/DesktopNavigation.tsx \
            src/components/navigation/MobileNavigation.tsx

          printf 'F2_FORMAT_TAR_GZ_BASE64='
          base64 -w0 "$archive"
          printf '\n'
