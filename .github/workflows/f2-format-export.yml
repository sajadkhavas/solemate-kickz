name: Temporary F2 Formatter

on:
  push:
    branches:
      - "phase/sole-f2-navigation-search"

permissions:
  contents: write

concurrency:
  group: temporary-f2-formatter
  cancel-in-progress: true

jobs:
  format-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out F2 branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f2-navigation-search
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Apply exact F2 formatting
        run: |
          bunx prettier --write \
            docs/handoffs/F2-NAVIGATION-SEARCH.md \
            scripts/audit-f2-navigation-search.mjs \
            scripts/f2-browser-runner.mjs \
            scripts/test-f2-navigation-search.mjs \
            scripts/visual-qa-f2-navigation-search.mjs \
            src/components/MobileBottomNav.tsx \
            src/components/navigation/DesktopNavigation.tsx \
            src/components/navigation/MobileNavigation.tsx

      - name: Commit formatting only
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/handoffs/F2-NAVIGATION-SEARCH.md \
            scripts/audit-f2-navigation-search.mjs \
            scripts/f2-browser-runner.mjs \
            scripts/test-f2-navigation-search.mjs \
            scripts/visual-qa-f2-navigation-search.mjs \
            src/components/MobileBottomNav.tsx \
            src/components/navigation/DesktopNavigation.tsx \
            src/components/navigation/MobileNavigation.tsx
          git commit -m "chore(format): apply exact F2 formatting"
          git push origin HEAD:phase/sole-f2-navigation-search
