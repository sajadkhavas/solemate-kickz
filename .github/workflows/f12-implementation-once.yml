name: F12 implementation once

on:
  push:
    branches:
      - "phase/sole-f12-performance-media"

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/sole-f12-performance-media
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Apply F12 implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing replacement target in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Homepage render containment: preserve SSR/semantics while letting the browser skip below-fold paint/layout work.
          replace(
              "src/routes/index.tsx",
              'import { createFileRoute } from "@tanstack/react-router";\n',
              'import { createFileRoute } from "@tanstack/react-router";\nimport type { ReactNode } from "react";\n',
          )
          replace(
              "src/routes/index.tsx",
              'function Home() {\n',
              'function PerfSection({ children }: { children: ReactNode }) {\n  return (\n    <div\n      data-f12-content-visibility="auto"\n      className="[contain-intrinsic-size:auto_900px] [content-visibility:auto]"\n    >\n      {children}\n    </div>\n  );\n}\n\nfunction Home() {\n',
          )
          for component in [
              "MerchandisingShowcase",
              "Categories",
              "BrandWall",
              "HypeSection",
              "TrustBadges",
              "Newsletter",
          ]:
              replace(
                  "src/routes/index.tsx",
                  f"        <{component} />",
                  f"        <PerfSection>\n          <{component} />\n        </PerfSection>",
              )

          # Deliver modern Unsplash formats without changing the curated photo IDs.
          replace(
              "src/data/shoes.ts",
              '?w=900&h=900&fit=crop&crop=${crop}&q=80`;',
              '?w=900&h=900&fit=crop&crop=${crop}&auto=format&q=78`;',
          )

          # Prioritize only the first visible catalog cards; keep the rest lazy.
          replace(
              "src/components/ShoeCard.tsx",
              '  className,\n}: {\n  shoe: Shoe;\n  source: string;\n  imageRef: RefObject<HTMLImageElement | null>;\n  className: string;\n}) {',
              '  className,\n  priority,\n}: {\n  shoe: Shoe;\n  source: string;\n  imageRef: RefObject<HTMLImageElement | null>;\n  className: string;\n  priority: boolean;\n}) {',
          )
          replace(
              "src/components/ShoeCard.tsx",
              '      loading="lazy"\n      width={640}\n      height={640}\n',
              '      loading={priority ? "eager" : "lazy"}\n      fetchPriority={priority ? "high" : "auto"}\n      decoding="async"\n      width={640}\n      height={640}\n',
          )
          text = Path("src/components/ShoeCard.tsx").read_text()
          text = text.replace(
              '            className={`h-full w-full object-cover transition-transform duration-500 hover:scale-105 motion-reduce:transition-none ${shoe.isSoldOut ? "grayscale opacity-60" : ""}`}\n          />',
              '            className={`h-full w-full object-cover transition-transform duration-500 hover:scale-105 motion-reduce:transition-none ${shoe.isSoldOut ? "grayscale opacity-60" : ""}`}\n            priority={index < 2}\n          />',
              1,
          )
          text = text.replace(
              '            className={`h-full w-full object-cover transition-transform duration-700 group-hover:scale-105 motion-reduce:transition-none ${shoe.isSoldOut ? "grayscale opacity-60" : ""}`}\n          />',
              '            className={`h-full w-full object-cover transition-transform duration-700 group-hover:scale-105 motion-reduce:transition-none ${shoe.isSoldOut ? "grayscale opacity-60" : ""}`}\n            priority={index < 2}\n          />',
              1,
          )
          Path("src/components/ShoeCard.tsx").write_text(text)

          # Product gallery: main image is LCP-oriented; thumbnails remain lazy and low priority.
          replace(
              "src/components/product/ProductGallery.tsx",
              '  testId?: string;\n  onFailure?: () => void;\n};',
              '  testId?: string;\n  onFailure?: () => void;\n  loading?: "eager" | "lazy";\n  fetchPriority?: "high" | "low" | "auto";\n  width?: number;\n  height?: number;\n};',
          )
          replace(
              "src/components/product/ProductGallery.tsx",
              'function SafeImage({ src, alt, className, testId, onFailure }: SafeImageProps) {',
              'function SafeImage({\n  src,\n  alt,\n  className,\n  testId,\n  onFailure,\n  loading = "lazy",\n  fetchPriority = "auto",\n  width,\n  height,\n}: SafeImageProps) {',
          )
          replace(
              "src/components/product/ProductGallery.tsx",
              '      alt={alt}\n      className={className}\n',
              '      alt={alt}\n      loading={loading}\n      fetchPriority={fetchPriority}\n      decoding="async"\n      width={width}\n      height={height}\n      className={className}\n',
          )
          replace(
              "src/components/product/ProductGallery.tsx",
              '          testId="product-main-image"\n          className="h-full w-full object-cover motion-safe:transition-transform motion-safe:duration-300 group-hover:scale-[1.02]"\n',
              '          testId="product-main-image"\n          loading="eager"\n          fetchPriority="high"\n          width={900}\n          height={900}\n          className="h-full w-full object-cover motion-safe:transition-transform motion-safe:duration-300 group-hover:scale-[1.02]"\n',
          )
          replace(
              "src/components/product/ProductGallery.tsx",
              '<SafeImage src={image} alt="" className="h-full w-full object-cover" />',
              '<SafeImage\n                src={image}\n                alt=""\n                loading="lazy"\n                fetchPriority="low"\n                width={220}\n                height={220}\n                className="h-full w-full object-cover"\n              />',
          )

          # Register phase scripts without changing dependencies or lockfile.
          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          scripts = package["scripts"]
          scripts["audit:f12"] = "node scripts/audit-f12-performance-media.mjs"
          scripts["qa:perf:f12"] = "node scripts/qa-f12-build-budgets.mjs"
          scripts["format:f12"] = "prettier --write docs/handoffs/F12-PERFORMANCE-MEDIA.md scripts/audit-f12-performance-media.mjs scripts/qa-f12-build-budgets.mjs scripts/verify-cumulative-quality.mjs src/routes/index.tsx src/data/shoes.ts src/components/ShoeCard.tsx src/components/product/ProductGallery.tsx .github/workflows/frontend-ci.yml package.json"
          scripts["check"] = scripts["check"].replace(
              "bun run audit:f11 && bun run audit:deploy",
              "bun run audit:f11 && bun run audit:f12 && bun run audit:deploy",
          ).replace(
              "bun run format:check && bun run build && bun run qa:visual:f0-f1",
              "bun run format:check && bun run build && bun run qa:perf:f12 && bun run qa:visual:f0-f1",
          )
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n")

          # Cumulative evidence must include F12.
          replace(
              "scripts/verify-cumulative-quality.mjs",
              '  "f11-technical-seo",\n];',
              '  "f11-technical-seo",\n  "f12-performance-media",\n];',
          )

          # CI source + build budget gates.
          replace(
              ".github/workflows/frontend-ci.yml",
              '      - name: VPS deployment contract audit\n        run: bun run audit:deploy\n',
              '      - name: F12 performance/media source audit\n        run: bun run audit:f12\n\n      - name: VPS deployment contract audit\n        run: bun run audit:deploy\n',
          )
          replace(
              ".github/workflows/frontend-ci.yml",
              '      - name: VPS Node-server build\n        run: bun run build:vps\n',
              '      - name: F12 build performance budgets\n        run: bun run qa:perf:f12\n\n      - name: VPS Node-server build\n        run: bun run build:vps\n',
          )
          replace(
              ".github/workflows/frontend-ci.yml",
              'F9, F10 and F11`',
              'F9, F10, F11 and F12`',
          )

          replace(
              "docs/handoffs/F12-PERFORMANCE-MEDIA.md",
              "Status: In progress",
              "Status: Candidate — exact-head CI pending",
          )
          PY

          cat > scripts/audit-f12-performance-media.mjs <<'EOF'
          import { spawnSync } from "node:child_process";
          import fs from "node:fs";
          import path from "node:path";
          import process from "node:process";

          const ROOT = process.cwd();
          const BASELINE = "4e08af6f1b0ac6bde85f400601c27a22fd69506f";
          const REPORT = path.join(ROOT, "artifacts/audits/f12-performance-media.json");
          const checks = [];

          const read = (file) => fs.readFileSync(path.join(ROOT, file), "utf8");
          const git = (...args) => spawnSync("git", args, { cwd: ROOT, encoding: "utf8" });
          const record = (name, pass, evidence = null) => {
            checks.push({ name, pass: Boolean(pass), evidence });
            if (!pass) console.error(`FAIL ${name}: ${JSON.stringify(evidence)}`);
          };

          const branch = process.env.GITHUB_HEAD_REF || git("branch", "--show-current").stdout.trim() || process.env.GITHUB_REF_NAME || "detached";
          record("F12 runs on a controlled phase or Integration branch", /^phase\/sole-f12-/.test(branch) || branch === "integration/sole-frontend-v2" || process.env.CI === "true", branch);
          record("accepted F11+homepage Integration baseline is ancestor", git("merge-base", "--is-ancestor", BASELINE, "HEAD").status === 0, BASELINE);

          const shoes = read("src/data/shoes.ts");
          const card = read("src/components/ShoeCard.tsx");
          const gallery = read("src/components/product/ProductGallery.tsx");
          const home = read("src/routes/index.tsx");
          const viewer = read("src/components/ShoeViewer3D.tsx");
          const workflow = read(".github/workflows/frontend-ci.yml");
          const pkg = read("package.json");
          const cumulative = read("scripts/verify-cumulative-quality.mjs");
          const handoff = read("docs/handoffs/F12-PERFORMANCE-MEDIA.md");

          record("remote sneaker media requests modern negotiated formats", shoes.includes("auto=format") && shoes.includes("q=78"), null);
          record("catalog prioritizes only initial images and async-decodes all cards", card.includes('loading={priority ? "eager" : "lazy"}') && card.includes('fetchPriority={priority ? "high" : "auto"}') && card.includes('decoding="async"') && (card.match(/priority=\{index < 2\}/g) ?? []).length >= 2, null);
          record("PDP main image is eager/high while thumbnails stay lazy/low", gallery.includes('testId="product-main-image"') && gallery.includes('loading="eager"') && gallery.includes('fetchPriority="high"') && gallery.includes('fetchPriority="low"') && gallery.includes('decoding="async"'), null);
          record("below-fold homepage work uses browser-native content visibility", (home.match(/data-f12-content-visibility="auto"/g) ?? []).length >= 6 && home.includes("[content-visibility:auto]") && home.includes("[contain-intrinsic-size:auto_900px]"), null);
          record("hero 3D remains explicit opt-in and dynamically isolated", viewer.includes('data-testid="shoe-viewer-enable-3d"') && viewer.includes('import("@google/model-viewer")') && viewer.includes('import("@/lib/create-shoe-model")') && viewer.includes("activated && inView && documentVisible") && !viewer.includes('import { ModelViewer'), null);

          const assetDir = path.join(ROOT, "src/assets");
          const raster = fs.readdirSync(assetDir).filter((file) => /\.(?:jpe?g|png|webp|avif)$/i.test(file)).map((file) => ({ file, bytes: fs.statSync(path.join(assetDir, file)).size }));
          const oversized = raster.filter((item) => item.bytes > 180_000);
          record("local raster media stays under 180 kB per file", oversized.length === 0, { largest: [...raster].sort((a,b) => b.bytes-a.bytes).slice(0,3), oversized });

          record("F12 scripts are registered", pkg.includes('"audit:f12"') && pkg.includes('"qa:perf:f12"'), null);
          record("Frontend CI enforces F12 source and build budgets", workflow.includes("F12 performance/media source audit") && workflow.includes("F12 build performance budgets"), null);
          record("cumulative verifier requires F12 evidence", cumulative.includes('"f12-performance-media"'), null);
          record("handoff records baseline and budgets", handoff.includes("Baseline SHA") && handoff.includes("F12 budgets") && handoff.includes(BASELINE), null);
          record("lockfile is untouched", git("diff", "--name-only", BASELINE, "HEAD", "--", "bun.lock").stdout.trim() === "", null);
          record("runtime artifacts are not tracked", git("ls-files", "artifacts").stdout.trim() === "", null);
          record("temporary implementation workflow is not tracked", git("ls-files", ".github/workflows/f12-implementation-once.yml").stdout.trim() === "", null);

          const failed = checks.filter((check) => !check.pass);
          const report = { schemaVersion: 1, suite: "f12-performance-media", generatedAt: new Date().toISOString(), baseline: BASELINE, branch, summary: { total: checks.length, passed: checks.length - failed.length, failed: failed.length }, checks, pass: failed.length === 0 };
          fs.mkdirSync(path.dirname(REPORT), { recursive: true });
          fs.writeFileSync(REPORT, `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report.summary));
          if (failed.length) process.exitCode = 1;
          EOF

          cat > scripts/qa-f12-build-budgets.mjs <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          import process from "node:process";
          import { gzipSync } from "node:zlib";

          const ROOT = process.cwd();
          const ASSETS = path.join(ROOT, ".output/public/assets");
          const REPORT = path.join(ROOT, "artifacts/reports/f12-performance-media-budget.json");
          if (!fs.existsSync(ASSETS)) throw new Error("Production client assets are missing; run bun run build first.");

          const files = fs.readdirSync(ASSETS).filter((file) => fs.statSync(path.join(ASSETS, file)).isFile());
          const metric = (file) => {
            const bytes = fs.readFileSync(path.join(ASSETS, file));
            return { file, bytes: bytes.length, gzipBytes: gzipSync(bytes, { level: 9 }).length };
          };
          const js = files.filter((file) => file.endsWith(".js")).map(metric);
          const css = files.filter((file) => file.endsWith(".css")).map(metric);
          const home = js.filter((item) => /^index-.*\.js$/.test(item.file)).sort((a,b) => b.bytes-a.bytes)[0];
          const modelViewer = js.find((item) => /^model-viewer-.*\.js$/.test(item.file));
          const globalCss = css.filter((item) => /^styles-.*\.css$/.test(item.file)).sort((a,b) => b.bytes-a.bytes)[0];
          const non3dMax = js.filter((item) => !/^model-viewer-/.test(item.file)).sort((a,b) => b.bytes-a.bytes)[0];

          const checks = [
            { name: "homepage route chunk exists", pass: Boolean(home), evidence: home ?? null },
            { name: "homepage minified budget <= 610 kB", pass: Boolean(home && home.bytes <= 610_000), evidence: home ?? null },
            { name: "homepage gzip budget <= 190 kB", pass: Boolean(home && home.gzipBytes <= 190_000), evidence: home ?? null },
            { name: "largest non-3D JS chunk <= 650 kB", pass: Boolean(non3dMax && non3dMax.bytes <= 650_000), evidence: non3dMax ?? null },
            { name: "model-viewer remains isolated", pass: Boolean(modelViewer), evidence: modelViewer ?? null },
            { name: "global CSS minified budget <= 125 kB", pass: Boolean(globalCss && globalCss.bytes <= 125_000), evidence: globalCss ?? null },
            { name: "global CSS gzip budget <= 22 kB", pass: Boolean(globalCss && globalCss.gzipBytes <= 22_000), evidence: globalCss ?? null },
          ];
          const failed = checks.filter((check) => !check.pass);
          const report = { schemaVersion: 1, suite: "f12-performance-media-budget", generatedAt: new Date().toISOString(), budgets: { homeBytes: 610000, homeGzipBytes: 190000, maxNon3dBytes: 650000, globalCssBytes: 125000, globalCssGzipBytes: 22000 }, summary: { total: checks.length, passed: checks.length - failed.length, failed: failed.length }, metrics: { home, modelViewer, globalCss, non3dMax }, checks, pass: failed.length === 0 };
          fs.mkdirSync(path.dirname(REPORT), { recursive: true });
          fs.writeFileSync(REPORT, `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report));
          if (failed.length) process.exitCode = 1;
          EOF

          rm .github/workflows/f12-implementation-once.yml
          bunx prettier --write \
            docs/handoffs/F12-PERFORMANCE-MEDIA.md \
            scripts/audit-f12-performance-media.mjs \
            scripts/qa-f12-build-budgets.mjs \
            scripts/verify-cumulative-quality.mjs \
            src/routes/index.tsx \
            src/data/shoes.ts \
            src/components/ShoeCard.tsx \
            src/components/product/ProductGallery.tsx \
            .github/workflows/frontend-ci.yml \
            package.json

      - name: Validate candidate
        run: |
          bun run audit:f12
          bun run typecheck
          bun run build
          bun run qa:perf:f12

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement F12 performance and media optimization"
          git push origin HEAD:phase/sole-f12-performance-media
