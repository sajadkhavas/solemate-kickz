name: F12 implementation retry

on:
  push:
    branches:
      - "phase/sole-f12-performance-media"

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/sole-f12-performance-media
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Apply corrected F12 patch
        shell: bash
        run: |
          python scripts/f12-apply-retry.py
          python <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/frontend-ci.yml')
          text = p.read_text()
          old = '      - name: Production build\n        run: bun run build\n'
          new = '''      - name: F12 format check
        run: >-
          bunx prettier --check
          docs/handoffs/F12-PERFORMANCE-MEDIA.md
          scripts/audit-f12-performance-media.mjs
          scripts/qa-f12-build-budgets.mjs
          scripts/verify-cumulative-quality.mjs
          src/routes/index.tsx
          src/data/shoes.ts
          src/components/ShoeCard.tsx
          src/components/product/ProductGallery.tsx
          .github/workflows/frontend-ci.yml
          package.json

      - name: Production build
        run: bun run build
'''
          if old not in text:
              raise SystemExit('Production build insertion target missing')
          p.write_text(text.replace(old, new, 1))
          PY

          rm -f \
            .github/workflows/f12-implementation-once.yml \
            .github/workflows/f12-implementation-retry.yml \
            scripts/f12-apply-retry.py

          bunx prettier --write \
            docs/handoffs/F12-PERFORMANCE-MEDIA.md \
            scripts/audit-f12-performance-media.mjs \
            scripts/qa-f12-build-budgets.mjs \
            scripts/verify-cumulative-quality.mjs \
            src/routes/index.tsx \
            src/data/shoes.ts \
            src/components/ShoeCard.tsx \
            src/components/product/ProductGallery.tsx \
            .github/workflows/frontend-ci.yml \
            package.json

      - name: Validate source contracts
        run: |
          bun run audit:f12
          node scripts/audit-f3-homepage.mjs
          bun run audit:f6
          bun run typecheck

      - name: Validate production budgets
        run: |
          bun run build
          bun run qa:perf:f12

      - name: Commit clean F12 candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          test -z "$(git ls-files '.github/workflows/f12-implementation-*.yml' 'scripts/f12-apply-retry.py')"
          test -z "$(git diff --cached --name-only -- bun.lock)"
          git commit -m "Implement F12 performance and media optimization"
          git push origin HEAD:phase/sole-f12-performance-media
