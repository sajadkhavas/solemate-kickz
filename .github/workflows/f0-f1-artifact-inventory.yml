name: F0/F1 Artifact Inventory

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List repository artifacts and caches
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );

            const artifactRows = artifacts
              .sort((a, b) => b.size_in_bytes - a.size_in_bytes)
              .map((artifact) => ({
                id: artifact.id,
                name: artifact.name,
                size: artifact.size_in_bytes,
                expired: artifact.expired,
                created_at: artifact.created_at,
                workflow_run_id: artifact.workflow_run?.id ?? null,
              }));

            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
              (response) => response.data.actions_caches,
            );

            const cacheRows = caches
              .sort((a, b) => b.size_in_bytes - a.size_in_bytes)
              .map((cache) => ({
                id: cache.id,
                key: cache.key,
                ref: cache.ref,
                size: cache.size_in_bytes,
                created_at: cache.created_at,
                last_accessed_at: cache.last_accessed_at,
              }));

            const artifactTotal = artifactRows.reduce((sum, artifact) => sum + artifact.size, 0);
            const cacheTotal = cacheRows.reduce((sum, cache) => sum + cache.size, 0);
            core.info(`ARTIFACT_TOTAL_COUNT=${artifactRows.length}`);
            core.info(`ARTIFACT_TOTAL_BYTES=${artifactTotal}`);
            core.info(`ARTIFACT_INVENTORY_JSON=${JSON.stringify(artifactRows)}`);
            core.info(`CACHE_TOTAL_COUNT=${cacheRows.length}`);
            core.info(`CACHE_TOTAL_BYTES=${cacheTotal}`);
            core.info(`CACHE_INVENTORY_JSON=${JSON.stringify(cacheRows)}`);
