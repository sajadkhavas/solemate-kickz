name: F0/F1 Artifact Inventory

on:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete repository Actions caches
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.request(
              'GET /repos/{owner}/{repo}/actions/caches',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            const caches = response.data.actions_caches ?? [];
            let bytes = 0;

            for (const cache of caches) {
              bytes += cache.size_in_bytes ?? 0;
              core.info(`Deleting cache ${cache.id}: ${cache.key} (${cache.size_in_bytes} bytes)`);
              await github.request(
                'DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                },
              );
            }

            core.info(`DELETED_CACHE_COUNT=${caches.length}`);
            core.info(`DELETED_CACHE_BYTES=${bytes}`);
