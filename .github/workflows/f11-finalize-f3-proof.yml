name: F11 finalize F3 formatting proof

on:
  push:
    branches:
      - phase/sole-f11-technical-seo

permissions:
  contents: write

concurrency:
  group: f11-finalize-f3-proof
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out F11 branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f11-technical-seo
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Harden F11 proof for F3 formatting-only cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/audit-f11-technical-seo.mjs')
          s = p.read_text()
          old = 'const FORMAT_COMMIT_MESSAGE = "Normalize cumulative Prettier formatting";\n'
          new = old + 'const F3_FORMAT_FILE = "scripts/audit-f3-homepage.mjs";\nconst F3_FORMAT_COMMIT_MESSAGE = "Normalize F3 homepage audit formatting";\n'
          if 'const F3_FORMAT_FILE =' not in s:
              if old not in s:
                  raise SystemExit('format constant anchor missing')
              s = s.replace(old, new, 1)

          anchor = '  "scripts/audit-f2-navigation-search.mjs",\n'
          if '  F3_FORMAT_FILE,\n' not in s:
              if anchor not in s:
                  raise SystemExit('PHASE_FILES anchor missing')
              s = s.replace(anchor, anchor + '  F3_FORMAT_FILE,\n', 1)

          proof_anchor = 'const requiredFiles = [\n'
          proof = '''const f3FormatComparison = formatBaselineFile(F3_FORMAT_FILE);\nrecord(\n  "F3 homepage audit final content is formatting-only versus the accepted baseline",\n  f3FormatComparison.pass,\n  f3FormatComparison,\n);\nconst f3FormatSubjects = lines(\n  git("log", "--format=%s", `${BASELINE}..HEAD`, "--", F3_FORMAT_FILE).stdout,\n);\nrecord(\n  "F3 homepage audit changed only through the supervised formatting commit",\n  f3FormatSubjects.length === 1 && f3FormatSubjects[0] === F3_FORMAT_COMMIT_MESSAGE,\n  f3FormatSubjects,\n);\n\n'''
          if 'F3 homepage audit final content is formatting-only versus the accepted baseline' not in s:
              if proof_anchor not in s:
                  raise SystemExit('proof anchor missing')
              s = s.replace(proof_anchor, proof + proof_anchor, 1)

          p.write_text(s)
          PY
          bunx prettier --write scripts/audit-f11-technical-seo.mjs

      - name: Commit hardened proof
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-f11-technical-seo.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Enforce formatting-only F3 cleanup"
          git push origin HEAD:phase/sole-f11-technical-seo
