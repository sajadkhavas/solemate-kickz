name: Temporary F4-F5 Focus Patch

on:
  push:
    branches:
      - "phase/sole-f4-f5-catalog-product-card"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/sole-f4-f5-catalog-product-card
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Apply controlled-dialog focus restoration
        run: |
          python3 scripts/patch-f4-f5-quick-view-focus.py
          bunx prettier --write src/components/ShoeCard.tsx src/routes/products.tsx src/components/catalog/QuickViewDialog.tsx
          rm scripts/patch-f4-f5-quick-view-focus.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ShoeCard.tsx src/routes/products.tsx src/components/catalog/QuickViewDialog.tsx
          git add -u scripts/patch-f4-f5-quick-view-focus.py
          git commit -m "fix(a11y): restore Quick View opener focus"
          git push origin HEAD:phase/sole-f4-f5-catalog-product-card
