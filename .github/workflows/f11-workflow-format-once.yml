name: F11 one-time workflow formatting

on:
  push:
    branches:
      - phase/sole-f11-technical-seo

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/sole-f11-technical-seo
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Format workflow with locked Prettier
        run: |
          ./node_modules/.bin/prettier --write .github/workflows/frontend-ci.yml
          git diff --check

      - name: Commit exact formatter output and remove this workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/f11-workflow-format-once.yml
          git add .github/workflows/frontend-ci.yml
          git diff --cached --check
          git commit -m 'Format frontend CI with locked Prettier'
          git push origin HEAD:phase/sole-f11-technical-seo
