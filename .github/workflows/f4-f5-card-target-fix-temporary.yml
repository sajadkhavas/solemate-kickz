name: Temporary F4-F5 Card Target Fix

on:
  push:
    branches:
      - "phase/sole-f4-f5-catalog-product-card"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f4-f5-catalog-product-card
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install
        run: bun install --frozen-lockfile

      - name: Apply accessible target correction
        run: |
          python3 scripts/patch-f4-f5-card-title-targets.py
          bunx prettier --write src/components/ShoeCard.tsx scripts/audit-f4-f5-catalog-product-card.mjs
          rm scripts/patch-f4-f5-card-title-targets.py
          rm .github/workflows/f4-f5-visual-report-temporary.yml
          rm .github/workflows/f4-f5-card-target-fix-temporary.yml

      - name: Commit verified correction and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ShoeCard.tsx scripts/audit-f4-f5-catalog-product-card.mjs
          git add -u scripts/patch-f4-f5-card-title-targets.py
          git add -u .github/workflows/f4-f5-visual-report-temporary.yml
          git add -u .github/workflows/f4-f5-card-target-fix-temporary.yml
          git commit -m "fix(a11y): enforce 44px Product Card detail targets"
          git push origin HEAD:phase/sole-f4-f5-catalog-product-card
