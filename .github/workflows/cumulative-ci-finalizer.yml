name: Temporary cumulative CI finalizer

on:
  push:
    branches:
      - phase/sole-f4-f5-catalog-product-card
    paths:
      - .github/workflows/cumulative-ci-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f4-f5-catalog-product-card
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Apply deterministic cumulative gate
        run: |
          python3 scripts/patch-cumulative-ci-once.py
          bunx prettier --write package.json .github/workflows/frontend-ci.yml scripts/verify-cumulative-quality.mjs
          rm scripts/patch-cumulative-ci-once.py
          rm .github/workflows/cumulative-ci-finalizer.yml

      - name: Commit deterministic CI structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): run cumulative quality suites once"
          git push origin HEAD:phase/sole-f4-f5-catalog-product-card
