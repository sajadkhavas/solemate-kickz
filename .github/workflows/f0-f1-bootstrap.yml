name: F0/F1 Foundation Gate

on:
  push:
    branches:
      - phase/sole-f0-f1-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f0-f1-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'docs(handoff): finalize')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out mission branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f0-f1-foundation
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run foundation validation
        shell: bash
        run: |
          set +e
          evidence="$GITHUB_WORKSPACE/artifacts/validation"
          mkdir -p "$evidence" "$GITHUB_WORKSPACE/artifacts/audits"
          rm -f "$evidence"/*.txt

          {
            echo "validated_commit=$(git rev-parse HEAD)"
            echo "baseline=137344f1d89373a55e3bf4bb4d82b48d8247b45f"
            echo "node=$(node --version)"
            echo "bun=$(bun --version)"
            echo "lockfile=$(test -f bun.lock && echo bun.lock || echo missing)"
            echo "package_manager=bun"
          } | tee "$evidence/toolchain.txt"

          run_and_record() {
            local name="$1"
            shift
            "$@" > "$evidence/${name}.txt" 2>&1
            local code=$?
            echo "${name}=${code}" >> "$evidence/status.txt"
            return 0
          }

          : > "$evidence/status.txt"
          run_and_record install bun install --frozen-lockfile

          if grep -qx 'install=0' "$evidence/status.txt"; then
            run_and_record audit bun run audit:f0-f1
            run_and_record tests bun run test:foundation
            run_and_record typecheck bun run typecheck
            run_and_record lint bun run lint
            run_and_record build bun run build
            run_and_record format_check bun run format:check
            run_and_record check bun run check
          else
            for name in audit tests typecheck lint build format_check check; do
              echo "${name}=skipped" >> "$evidence/status.txt"
            done
          fi

          if awk -F= '$2 != "0" { bad=1 } END { exit bad ? 0 : 1 }' "$evidence/status.txt"; then
            echo "overall=1" >> "$evidence/status.txt"
          else
            echo "overall=0" >> "$evidence/status.txt"
          fi

          cat "$evidence/status.txt"

      - name: Commit validation evidence
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/validation artifacts/audits
          if git diff --cached --quiet; then
            echo "No validation evidence changes to commit."
            exit 0
          fi
          git commit -m "chore(audit): record F0-F1 validation evidence"
          git push origin HEAD:phase/sole-f0-f1-foundation
