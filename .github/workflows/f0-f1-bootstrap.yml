name: F0/F1 Baseline Bootstrap

on:
  push:
    branches:
      - phase/sole-f0-f1-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f0-f1-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out mission branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f0-f1-foundation
          path: branch
          fetch-depth: 0

      - name: Check out exact baseline
        uses: actions/checkout@v4
        with:
          ref: 137344f1d89373a55e3bf4bb4d82b48d8247b45f
          path: baseline
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Record baseline evidence
        shell: bash
        run: |
          set -u
          evidence="$GITHUB_WORKSPACE/branch/artifacts/bootstrap"
          mkdir -p "$evidence"
          rm -f "$evidence"/*.txt "$evidence"/*.tsv

          cd "$GITHUB_WORKSPACE/baseline"
          {
            echo "baseline=137344f1d89373a55e3bf4bb4d82b48d8247b45f"
            echo "node=$(node --version)"
            echo "bun=$(bun --version)"
            echo "lockfile=$(test -f bun.lock && echo bun.lock || echo missing)"
            echo "package_manager=bun"
          } | tee "$evidence/toolchain.txt"

          git ls-files -z | while IFS= read -r -d '' file; do
            size=$(wc -c < "$file" | tr -d ' ')
            printf '%s\t%s\n' "$size" "$file"
          done | sort -k2 > "$evidence/files.tsv"

          grep -RInE --exclude-dir=.git --exclude='bun.lock' \
            'href=["'"']#["'"']|javascript:|tabIndex=[{]?[1-9]|lang=["'"']en["'"']|dir=["'"']ltr["'"']' \
            . > "$evidence/foundation-patterns.txt" 2>&1 || true

          set +e
          bun install --frozen-lockfile > "$evidence/install.txt" 2>&1
          install_code=$?
          echo "install=$install_code" > "$evidence/status.txt"

          run_and_record() {
            local name="$1"
            shift
            "$@" > "$evidence/${name}.txt" 2>&1
            local code=$?
            echo "${name}=${code}" >> "$evidence/status.txt"
          }

          if [[ $install_code -eq 0 ]]; then
            run_and_record lint bun run lint
            run_and_record typecheck bunx tsc --noEmit
            run_and_record build bun run build
          else
            echo "lint=skipped" >> "$evidence/status.txt"
            echo "typecheck=skipped" >> "$evidence/status.txt"
            echo "build=skipped" >> "$evidence/status.txt"
          fi

      - name: Commit evidence to mission branch
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/bootstrap
          if git diff --cached --quiet; then
            echo "No baseline evidence changes to commit."
            exit 0
          fi
          git commit -m "chore(audit): refresh F0-F1 baseline evidence"
          git push origin HEAD:phase/sole-f0-f1-foundation
