name: F0/F1 Foundation Gate

on:
  push:
    branches:
      - phase/sole-f0-f1-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f0-f1-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'docs(handoff): finalize')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out mission branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f0-f1-foundation
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install from lockfile
        id: install
        continue-on-error: true
        shell: bash
        run: bun install --frozen-lockfile

      - name: Format F0/F1 files only
        if: steps.install.outcome == 'success'
        shell: bash
        run: bun run format:foundation

      - name: Run foundation validation
        if: always()
        shell: bash
        run: |
          set +e
          evidence="$GITHUB_WORKSPACE/artifacts/validation"
          baseline="137344f1d89373a55e3bf4bb4d82b48d8247b45f"
          mkdir -p "$evidence" "$GITHUB_WORKSPACE/artifacts/audits"
          rm -f "$evidence"/*.txt

          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "validated_tree=$(git write-tree)"
            echo "baseline=$baseline"
            echo "node=$(node --version)"
            echo "bun=$(bun --version)"
            echo "lockfile=$(test -f bun.lock && echo bun.lock || echo missing)"
            echo "package_manager=bun"
          } | tee "$evidence/toolchain.txt"

          git log --reverse --format='%H %s' "$baseline"..HEAD > "$evidence/commits.txt"
          git diff --name-status "$baseline"...HEAD > "$evidence/files-changed.txt"
          {
            echo "package_json_changed=$(git diff --quiet "$baseline"...HEAD -- package.json; test $? -eq 0 && echo no || echo yes)"
            echo "lockfile_changed=$(git diff --quiet "$baseline"...HEAD -- bun.lock; test $? -eq 0 && echo no || echo yes)"
            echo "dependency_diff_begin"
            git diff --unified=0 "$baseline"...HEAD -- package.json bun.lock || true
            echo "dependency_diff_end"
          } > "$evidence/dependencies.txt"

          run_and_record() {
            local name="$1"
            shift
            "$@" > "$evidence/${name}.txt" 2>&1
            local code=$?
            echo "${name}=${code}" >> "$evidence/status.txt"
            return 0
          }

          run_visual_qa() {
            local preview_pid
            local ready=0

            if [[ -x node_modules/.bin/wrangler && -f .output/server/wrangler.json ]]; then
              echo "runner=wrangler-generated-cloudflare-worker" > "$evidence/visual-server.txt"
              node_modules/.bin/wrangler dev \
                --config .output/server/wrangler.json \
                --local \
                --ip 127.0.0.1 \
                --port 4173 \
                --show-interactive-dev-session=false \
                --no-bundle \
                > "$evidence/preview.txt" 2>&1 &
              preview_pid=$!
            else
              echo "runner=vite-development-ssr-fallback" > "$evidence/visual-server.txt"
              bun run dev -- --host 127.0.0.1 --port 4173 > "$evidence/preview.txt" 2>&1 &
              preview_pid=$!
            fi

            for _ in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:4173/ > /dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 1
            done

            if [[ $ready -ne 1 ]]; then
              kill "$preview_pid" 2>/dev/null || true
              wait "$preview_pid" 2>/dev/null || true
              echo "Visual QA server did not become ready."
              return 1
            fi

            bun run qa:visual:f0-f1
            local visual_code=$?
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
            return "$visual_code"
          }

          : > "$evidence/status.txt"
          if [[ "${{ steps.install.outcome }}" == "success" ]]; then
            echo "install=0" >> "$evidence/status.txt"
            run_and_record audit bun run audit:f0-f1
            run_and_record tests bun run test:foundation
            run_and_record typecheck bun run typecheck
            run_and_record lint bun run lint
            run_and_record build bun run build
            if grep -qx 'build=0' "$evidence/status.txt"; then
              run_and_record visual_qa run_visual_qa
            else
              echo "visual_qa=skipped" >> "$evidence/status.txt"
            fi
            run_and_record format_check bun run format:check
            run_and_record check bun run check
          else
            echo "install=1" >> "$evidence/status.txt"
            for name in audit tests typecheck lint build visual_qa format_check check; do
              echo "${name}=skipped" >> "$evidence/status.txt"
            done
          fi

          if awk -F= '$2 != "0" { bad=1 } END { exit bad ? 0 : 1 }' "$evidence/status.txt"; then
            echo "overall=1" >> "$evidence/status.txt"
          else
            echo "overall=0" >> "$evidence/status.txt"
          fi

          git status --short > "$evidence/working-tree-before-evidence-commit.txt"
          cat "$evidence/status.txt"

      - name: Commit formatted files and validation evidence
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/f0-f1-bootstrap.yml \
            eslint.config.js \
            package.json \
            src/routes/__root.tsx \
            src/routes/about.tsx \
            src/routes/brands.tsx \
            src/styles.css \
            src/components/CartDrawer.tsx \
            src/components/MagneticCursor.tsx \
            src/components/ShoeCard.tsx \
            src/components/sections/BrandWall.tsx \
            src/components/sections/Footer.tsx \
            src/components/ui/button.tsx \
            src/components/ui/commerce-primitives.tsx \
            scripts/audit-f0-f1-foundation.mjs \
            scripts/test-f0-f1-primitives.mjs \
            scripts/visual-qa-f0-f1.mjs
          git add -f artifacts/validation artifacts/audits
          if [[ -f artifacts/visual-qa/f0-f1-visual-qa.json ]]; then
            git add -f artifacts/visual-qa/f0-f1-visual-qa.json
          fi
          if [[ -f artifacts/visual-qa/manifest.txt ]]; then
            git add -f artifacts/visual-qa/manifest.txt
          fi
          if git diff --cached --quiet; then
            echo "No validation evidence or formatting changes to commit."
            exit 0
          fi
          git commit -m "chore(audit): record F0-F1 validation evidence"
          git push origin HEAD:phase/sole-f0-f1-foundation

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f0-f1-visual-qa-screenshots
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/visual-qa/screenshots/
            artifacts/visual-qa/f0-f1-visual-qa.json
            artifacts/visual-qa/manifest.txt

      - name: Enforce foundation gate
        if: always()
        shell: bash
        run: grep -qx 'overall=0' artifacts/validation/status.txt
