name: Temporary F6 implementation finalizer

on:
  push:
    branches:
      - phase/sole-f6-product-detail
    paths:
      - .github/workflows/f6-implementation-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out F6 branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f6-product-detail
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Extract F6 implementation and register gates
        shell: bash
        run: |
          cat scripts/f6-payload.part-* | base64 --decode > /tmp/f6.zip
          python3 - <<'PY'
          from pathlib import Path
          import json
          import zipfile

          root = Path.cwd().resolve()
          with zipfile.ZipFile('/tmp/f6.zip') as archive:
              for info in archive.infolist():
                  target = (root / info.filename).resolve()
                  if root not in target.parents:
                      raise SystemExit(f'Unsafe archive path: {info.filename}')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(info.filename))

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text())
          scripts = package['scripts']
          scripts['test:foundation'] = 'node scripts/retry-foundation-browser-check.mjs'
          scripts['audit:f6'] = 'node scripts/audit-f6-product-detail.mjs'
          scripts['test:f6'] = 'node scripts/test-f6-product-detail.mjs'
          scripts['qa:visual:f6'] = 'node scripts/visual-qa-f6-product-detail.mjs'
          f6_files = 'docs/handoffs/F6-PRODUCT-DETAIL.md scripts/audit-f6-product-detail.mjs scripts/f6-browser-runner.mjs scripts/test-f6-product-detail.mjs scripts/visual-qa-f6-product-detail.mjs src/components/product/ProductGallery.tsx src/components/product/ProductPurchasePanel.tsx src/components/product/SizeGuideDialog.tsx src/routes/product.$id.tsx'
          scripts['format:f6'] = f'prettier --write {f6_files}'
          for key in ('format:foundation', 'format:check'):
              if 'docs/handoffs/F6-PRODUCT-DETAIL.md' not in scripts[key]:
                  scripts[key] += ' ' + f6_files
          check = scripts['check']
          if 'bun run audit:f6' not in check:
              check = check.replace('bun run audit:f4-f5', 'bun run audit:f4-f5 && bun run audit:f6', 1)
          if 'bun run test:f6' not in check:
              check = check.replace('bun run test:f4-f5', 'bun run test:f4-f5 && bun run test:f6', 1)
          if 'bun run qa:visual:f6' not in check:
              check = check.replace('bun run qa:visual:f4-f5', 'bun run qa:visual:f4-f5 && bun run qa:visual:f6', 1)
          scripts['check'] = check
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          workflow_path = root / '.github/workflows/frontend-ci.yml'
          workflow = workflow_path.read_text()
          behavior_marker = '''      - name: F4-F5 catalog browser behavior tests
                  run: bun run test:f4-f5

                - name: Typecheck
          '''
          behavior_replacement = '''      - name: F4-F5 catalog browser behavior tests
                  run: bun run test:f4-f5

                - name: F6 product detail completion audit
                  run: bun run audit:f6

                - name: F6 product detail browser behavior tests
                  run: bun run test:f6

                - name: Typecheck
          '''
          if 'F6 product detail completion audit' not in workflow:
              if behavior_marker not in workflow:
                  raise SystemExit('F6 behavior insertion marker not found')
              workflow = workflow.replace(behavior_marker, behavior_replacement, 1)

          visual_marker = '''      - name: F4-F5 catalog Visual QA
                  run: bun run qa:visual:f4-f5

                - name: Foundation completion audit
          '''
          visual_replacement = '''      - name: F4-F5 catalog Visual QA
                  run: bun run qa:visual:f4-f5

                - name: F6 product detail Visual QA
                  run: bun run qa:visual:f6

                - name: Foundation completion audit
          '''
          if 'F6 product detail Visual QA' not in workflow:
              if visual_marker not in workflow:
                  raise SystemExit('F6 visual insertion marker not found')
              workflow = workflow.replace(visual_marker, visual_replacement, 1)
          workflow = workflow.replace(
              'Included phases: F0/F1, F3, F2, F8 and F4/F5',
              'Included phases: F0/F1, F3, F2, F8, F4/F5 and F6',
          )
          workflow_path.write_text(workflow)

          verifier_path = root / 'scripts/verify-cumulative-quality.mjs'
          verifier = verifier_path.read_text()
          if '"f6-product-detail"' not in verifier:
              verifier = verifier.replace(
                  '  "f4-f5-catalog-product-card",\n',
                  '  "f4-f5-catalog-product-card",\n  "f6-product-detail",\n',
                  1,
              )
          verifier_path.write_text(verifier)
          PY

      - name: Format permanent files and remove staging files
        shell: bash
        run: |
          bunx prettier --write \
            .github/workflows/frontend-ci.yml \
            package.json \
            scripts/verify-cumulative-quality.mjs \
            docs/handoffs/F6-PRODUCT-DETAIL.md \
            scripts/audit-f6-product-detail.mjs \
            scripts/f6-browser-runner.mjs \
            scripts/test-f6-product-detail.mjs \
            scripts/visual-qa-f6-product-detail.mjs \
            src/components/product/ProductGallery.tsx \
            src/components/product/ProductPurchasePanel.tsx \
            src/components/product/SizeGuideDialog.tsx \
            'src/routes/product.$id.tsx'
          rm scripts/f6-payload.part-*
          rm .github/workflows/f6-implementation-finalizer.yml

      - name: Commit complete F6 implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(f6): complete product detail experience"
          git push origin HEAD:phase/sole-f6-product-detail
