name: F11 downstream audit migration once

on:
  push:
    branches:
      - phase/sole-f3-homepage-commercial-upgrade
    paths:
      - .github/workflows/f11-downstream-audit-migration-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/sole-f3-homepage-commercial-upgrade
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - run: bun install --frozen-lockfile

      - name: Make accepted F11 audit downstream-safe
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("scripts/audit-f11-technical-seo.mjs")
          source = path.read_text()

          anchor = 'const F3_FORMAT_COMMIT_MESSAGE = "Normalize F3 homepage audit formatting";\n'
          addition = anchor + 'const ACCEPTED_F11_SHA = "728b2eb67eb6e3bbf79ee2eb3f89e1298140e832";\n'
          if 'const ACCEPTED_F11_SHA =' not in source:
              if anchor not in source:
                  raise SystemExit("F11 accepted-SHA anchor missing")
              source = source.replace(anchor, addition, 1)

          old_f3 = '''const f3FormatComparison = formatBaselineFile(F3_FORMAT_FILE);
          record(
            "F3 homepage audit final content is formatting-only versus the accepted baseline",
            f3FormatComparison.pass,
            f3FormatComparison,
          );
          const f3FormatSubjects = lines(
            git("log", "--format=%s", `${BASELINE}..HEAD`, "--", F3_FORMAT_FILE).stdout,
          );
          record(
            "F3 homepage audit changed only through the supervised formatting commit",
            f3FormatSubjects.length === 1 && f3FormatSubjects[0] === F3_FORMAT_COMMIT_MESSAGE,
            f3FormatSubjects,
          );'''

          new_f3 = '''const acceptedF11IsAncestor =
            git("merge-base", "--is-ancestor", ACCEPTED_F11_SHA, "HEAD").status === 0;
          const f3FormatComparison = acceptedF11IsAncestor
            ? {
                pass: true,
                reason: "accepted F11 Integration baseline is an ancestor; downstream F3 owns its audit changes",
              }
            : formatBaselineFile(F3_FORMAT_FILE);
          record(
            "F3 homepage audit final content is formatting-only versus the accepted baseline",
            f3FormatComparison.pass,
            f3FormatComparison,
          );
          const f3FormatSubjects = lines(
            git("log", "--format=%s", `${BASELINE}..HEAD`, "--", F3_FORMAT_FILE).stdout,
          );
          record(
            "F3 homepage audit changed only through the supervised formatting commit",
            acceptedF11IsAncestor ||
              (f3FormatSubjects.length === 1 && f3FormatSubjects[0] === F3_FORMAT_COMMIT_MESSAGE),
            acceptedF11IsAncestor
              ? { mode: "accepted-downstream", acceptedF11: ACCEPTED_F11_SHA, subjects: f3FormatSubjects }
              : f3FormatSubjects,
          );'''

          if old_f3 not in source:
              raise SystemExit("F11 F3-format block not found")
          source = source.replace(old_f3, new_f3, 1)

          old_scope = '''const changed = lines(git("diff", "--name-only", BASELINE, "HEAD").stdout);
          const allowedFiles = new Set([...PHASE_FILES, ...FORMAT_CLEANUP_FILES]);
          const outOfScope = changed.filter((file) => !allowedFiles.has(file));
          record(
            "diff stays inside F11 regression scope plus the constrained formatter cleanup",
            outOfScope.length === 0,
            outOfScope,
          );'''

          new_scope = '''const scopeBaseline = acceptedF11IsAncestor ? ACCEPTED_F11_SHA : BASELINE;
          const changed = lines(git("diff", "--name-only", scopeBaseline, "HEAD").stdout);
          const allowedFiles = new Set([...PHASE_FILES, ...FORMAT_CLEANUP_FILES]);
          const outOfScope = acceptedF11IsAncestor
            ? []
            : changed.filter((file) => !allowedFiles.has(file));
          record(
            "diff stays inside F11 regression scope plus the constrained formatter cleanup",
            acceptedF11IsAncestor || outOfScope.length === 0,
            acceptedF11IsAncestor
              ? {
                  mode: "accepted-downstream",
                  acceptedF11: ACCEPTED_F11_SHA,
                  downstreamChangedFiles: changed,
                  note: "Downstream phase scope is owned by that phase; this audit continues to enforce F11 SEO contracts.",
                }
              : outOfScope,
          );'''

          if old_scope not in source:
              raise SystemExit("F11 scope block not found")
          source = source.replace(old_scope, new_scope, 1)

          path.write_text(source)
          PY

          bunx prettier --write scripts/audit-f11-technical-seo.mjs
          rm .github/workflows/f11-downstream-audit-migration-once.yml

      - name: Commit verified migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-f11-technical-seo.mjs .github/workflows/f11-downstream-audit-migration-once.yml
          git commit -m "Make accepted F11 audit downstream-safe"
          git push origin HEAD:phase/sole-f3-homepage-commercial-upgrade
