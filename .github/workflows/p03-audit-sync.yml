name: P03 audit sync

on:
  push:
    branches: [phase/sole-p03-auth-customer-security]
    paths: [.github/workflows/p03-audit-sync.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout P03 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase/sole-p03-auth-customer-security
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Wire P03 audit into existing production-program gate
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['audit:p03'] = 'node scripts/audit-p03-auth-customer-security.mjs'
          package['scripts']['audit:production-program'] = 'node scripts/audit-production-program.mjs && bun run audit:p03'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          audit_path = Path('scripts/audit-production-program.mjs')
          audit = audit_path.read_text()
          audit = audit.replace(
              'pkg?.scripts?.["audit:production-program"] !== "node scripts/audit-production-program.mjs"',
              'pkg?.scripts?.["audit:production-program"] !==\n  "node scripts/audit-production-program.mjs && bun run audit:p03"',
          )
          audit_path.write_text(audit)
          PY
          bunx prettier --write package.json scripts/audit-production-program.mjs scripts/audit-p03-auth-customer-security.mjs
          bun run audit:production-program
      - name: Remove temporary workflow and commit audit wiring
        run: |
          rm .github/workflows/p03-audit-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json scripts/audit-production-program.mjs scripts/audit-p03-auth-customer-security.mjs .github/workflows/p03-audit-sync.yml
          git commit -m 'test(p03): enforce auth security in production program gate'
          git push origin HEAD:phase/sole-p03-auth-customer-security
