name: F12 Format Two Once

on:
  push:
    branches:
      - phase/sole-f12-performance-media

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/sole-f12-performance-media
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
      - name: Format and push
        run: |
          npx --yes prettier@3.8.3 --write scripts/audit-f12-performance-media.mjs src/data/shoes.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-f12-performance-media.mjs src/data/shoes.ts
          git commit -m "Format F12 performance candidate"
          git push origin HEAD:phase/sole-f12-performance-media
