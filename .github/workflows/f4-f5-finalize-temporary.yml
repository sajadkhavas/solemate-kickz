name: Temporary F4-F5 Finalizer

on:
  push:
    branches:
      - "phase/sole-f4-f5-catalog-product-card"

permissions:
  contents: write

concurrency:
  group: temporary-f4-f5-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out phase branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f4-f5-catalog-product-card
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Patch cumulative scripts and stable selectors
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          test = Path("scripts/test-f4-f5-catalog-product-card.mjs")
          text = test.read_text()
          text = text.replace(
              "const wishlistSelector = '[data-testid=\"quick-view-dialog\"] button[aria-pressed]';",
              "const wishlistSelector = '[data-testid=\"quick-view-wishlist\"]';",
          )
          test.write_text(text)
          PY

          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const f45Files = [
            'docs/handoffs/F4-F5-CATALOG-PRODUCT-CARD.md',
            'scripts/audit-f4-f5-catalog-product-card.mjs',
            'scripts/f4-f5-browser-runner.mjs',
            'scripts/test-f4-f5-catalog-product-card.mjs',
            'scripts/visual-qa-f4-f5-catalog-product-card.mjs',
            'src/catalog/catalog-state.ts',
            'src/components/catalog/CatalogFilters.tsx',
            'src/components/catalog/QuickViewDialog.tsx',
            'src/components/ShoeCard.tsx',
            'src/routes/products.tsx',
          ];

          pkg.scripts['audit:f4-f5'] = 'node scripts/audit-f4-f5-catalog-product-card.mjs';
          pkg.scripts['test:f4-f5'] = 'node scripts/test-f4-f5-catalog-product-card.mjs';
          pkg.scripts['qa:visual:f4-f5'] = 'node scripts/visual-qa-f4-f5-catalog-product-card.mjs';
          pkg.scripts['format:f4-f5'] = `prettier --write ${f45Files.join(' ')}`;

          const checkParts = [
            'bun run audit:f0-f1',
            'bun run audit:f2',
            'bun run audit:f8',
            'bun run audit:f4-f5',
            'bun run audit:source-contracts',
            'bun run test:foundation',
            'bun run test:f2',
            'bun run test:f8',
            'bun run test:f4-f5',
            'bun run typecheck',
            'bun run lint',
            'bun run format:check',
            'bun run build',
            'bun run qa:visual:f0-f1',
            'bun run qa:visual:f2',
            'bun run qa:visual:f8',
            'bun run qa:visual:f4-f5',
          ];
          pkg.scripts.check = checkParts.join(' && ');

          const currentFormat = pkg.scripts['format:check'] || 'prettier --check';
          const prefix = currentFormat.startsWith('prettier --check') ? currentFormat : `prettier --check ${currentFormat}`;
          const missing = f45Files.filter((file) => !prefix.includes(file));
          pkg.scripts['format:check'] = `${prefix} ${missing.join(' ')}`.trim();

          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Format F4-F5 files and package
        run: |
          bun run format:f4-f5
          bunx prettier --write package.json

      - name: Commit deterministic finalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json scripts/test-f4-f5-catalog-product-card.mjs \
            docs/handoffs/F4-F5-CATALOG-PRODUCT-CARD.md \
            scripts/audit-f4-f5-catalog-product-card.mjs \
            scripts/f4-f5-browser-runner.mjs \
            scripts/visual-qa-f4-f5-catalog-product-card.mjs \
            src/catalog/catalog-state.ts \
            src/components/catalog/CatalogFilters.tsx \
            src/components/catalog/QuickViewDialog.tsx \
            src/components/ShoeCard.tsx \
            src/routes/products.tsx
          git commit -m "chore(f4-f5): finalize cumulative gates and formatting"
          git push origin HEAD:phase/sole-f4-f5-catalog-product-card
