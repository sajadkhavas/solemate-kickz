name: F2 Development Acceptance

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: f2-dev-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  f2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: F2 browser behavior
        run: node scripts/test-f2-navigation-search.mjs

      - name: F2 Visual QA
        run: node scripts/visual-qa-f2-navigation-search.mjs

      - name: Summarize generated evidence
        if: always()
        shell: bash
        run: |
          echo '## F2 development acceptance' >> "$GITHUB_STEP_SUMMARY"
          find artifacts -type f -maxdepth 5 -printf '%p\n' 2>/dev/null | sort | sed 's/^/- `/' | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY" || true
