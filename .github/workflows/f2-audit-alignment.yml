name: Temporary F2 Audit Alignment

on:
  push:
    branches:
      - "phase/sole-f2-navigation-search"

permissions:
  contents: write

concurrency:
  group: temporary-f2-audit-alignment
  cancel-in-progress: true

jobs:
  patch-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out F2 branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f2-navigation-search
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Align permanent audit with final behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("scripts/audit-f2-navigation-search.mjs")
          text = path.read_text()
          old = '''add(\n  "focus restoration policy",\n  /queueMicrotask/.test(files.navbar) &&\n    /searchTriggerRef/.test(files.navbar) &&\n    /queueMicrotask/.test(files.bottom) &&\n    /triggerRef/.test(files.mobile) &&\n    /focus\\(\\{ preventScroll: true \\}\\)/.test(shellSource),\n  "explicit desktop/mobile search and menu restoration",\n);'''
          new = '''add(\n  "focus restoration policy",\n  /openerRef = useRef<HTMLElement \\| null>/.test(files.search) &&\n    /document\\.activeElement instanceof HTMLElement/.test(files.search) &&\n    /onCloseAutoFocus/.test(files.search) &&\n    /openerRef\\.current\\?\\.focus\\(\\{ preventScroll: true \\}\\)/.test(files.search) &&\n    /triggerRef/.test(files.mobile) &&\n    /actual desktop and mobile opener/.test(files.behavior),\n  "Search Dialog restores the actual opener; Mobile Dialog restores its trigger",\n);'''
          if old not in text:
              raise SystemExit("Legacy F2 focus audit block not found")
          text = text.replace(old, new)
          old_tail = '''console.log(JSON.stringify(report.summary));\nconsole.log(`F2 audit report: ${path.relative(ROOT, REPORT_PATH)}`);\nif (!report.pass) process.exitCode = 1;'''
          new_tail = '''console.log(JSON.stringify(report.summary));\nif (failed.length) {\n  for (const check of failed) {\n    console.error(`FAILED: ${check.name}`, check.evidence);\n  }\n}\nconsole.log(`F2 audit report: ${path.relative(ROOT, REPORT_PATH)}`);\nif (!report.pass) process.exitCode = 1;'''
          if old_tail not in text:
              raise SystemExit("F2 audit output block not found")
          path.write_text(text.replace(old_tail, new_tail))
          PY

          bunx prettier --write scripts/audit-f2-navigation-search.mjs

      - name: Commit audit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-f2-navigation-search.mjs
          git commit -m "fix(audit): align F2 focus-restoration contract"
          git push origin HEAD:phase/sole-f2-navigation-search
