name: Temporary F2 Audit Diagnostic

on:
  push:
    branches:
      - "phase/sole-f2-navigation-search"

permissions:
  contents: read

concurrency:
  group: temporary-f2-audit-diagnostic
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Run F2 audit with failed-check output
        run: bun run audit:f2
