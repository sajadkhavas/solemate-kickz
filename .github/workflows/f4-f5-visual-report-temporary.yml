name: Temporary F4-F5 Visual Report

on:
  push:
    branches:
      - phase/sole-f4-f5-catalog-product-card
    paths:
      - .github/workflows/f4-f5-visual-report-temporary.yml

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out phase branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f4-f5-catalog-product-card
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install
        run: bun install --frozen-lockfile

      - name: Run visual suite and print report
        shell: bash
        run: |
          set +e
          bun run qa:visual:f4-f5
          status=$?
          echo '===== F4-F5 VISUAL REPORT ====='
          cat artifacts/visual-qa/f4-f5-catalog-product-card/f4-f5-catalog-product-card.json
          exit "$status"
