name: Temporary F4-F5 Visual Report

on:
  push:
    branches:
      - "phase/sole-f4-f5-catalog-product-card"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f4-f5-catalog-product-card

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install
        run: bun install --frozen-lockfile

      - name: Run Visual QA and print findings
        shell: bash
        run: |
          set +e
          bun run qa:visual:f4-f5
          visual_exit=$?
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("artifacts/visual-qa/f4-f5-catalog-product-card/f4-f5-catalog-product-card.json")
          report = json.loads(report_path.read_text())
          print("VISUAL_SUMMARY", json.dumps(report["summary"], ensure_ascii=False))
          for index, finding in enumerate(report["criticalFindings"], start=1):
              print(f"VISUAL_FINDING_{index}", json.dumps(finding, ensure_ascii=False))
          PY

          exit "$visual_exit"
