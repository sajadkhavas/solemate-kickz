name: F11 verify F6 fallback once

on:
  push:
    branches:
      - phase/sole-f11-technical-seo

permissions:
  contents: write

concurrency:
  group: f11-verify-f6-fallback-once
  cancel-in-progress: true

jobs:
  verify-and-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out F11 branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f11-technical-seo
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Align temporary audit anchor
        run: sed -i "s/f6Visual.includes('product-main-image-fallback')/f6Visual.includes(\"product-main-image-fallback\")/g" scripts/f11-apply-f6-visual-fix.py

      - name: Apply hydration-aware F6 visual fix
        run: python3 scripts/f11-apply-f6-visual-fix.py

      - name: Format changed files
        run: bunx prettier --write scripts/visual-qa-f6-product-detail.mjs scripts/audit-f11-technical-seo.mjs

      - name: Prove F6 Visual QA before commit
        run: bun run qa:visual:f6

      - name: Commit verified fix and remove temporary helpers
        shell: bash
        run: |
          rm -f .github/workflows/f11-verify-f6-fallback-once.yml
          rm -f scripts/f11-apply-f6-visual-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Verify F6 fallback after gallery hydration"
          git push origin HEAD:phase/sole-f11-technical-seo
