name: P07 format diagnostic

on:
  push:
    branches:
      - "phase/sole-p07-payment-shipping-returns"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Apply exact Prettier formatting
        run: >-
          bunx prettier --write
          scripts/audit-p07-payment-shipping-returns.mjs
          scripts/test-p07-payment-shipping-returns.mjs
          src/auth/ProductionNavbar.tsx
          src/auth/ProductionFooter.tsx
          src/auth/ProductionMobileBottomNav.tsx
          src/commerce/ProductionCheckoutPage.tsx
          src/commerce/ProductionOrdersPage.tsx
      - name: Capture formatted files
        run: |
          mkdir -p artifacts/formatted
          for file in \
            scripts/audit-p07-payment-shipping-returns.mjs \
            scripts/test-p07-payment-shipping-returns.mjs \
            src/auth/ProductionNavbar.tsx \
            src/auth/ProductionFooter.tsx \
            src/auth/ProductionMobileBottomNav.tsx \
            src/commerce/ProductionCheckoutPage.tsx \
            src/commerce/ProductionOrdersPage.tsx; do
            mkdir -p "artifacts/formatted/$(dirname "$file")"
            cp "$file" "artifacts/formatted/$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: p07-prettier-formatted
          path: artifacts/formatted
          if-no-files-found: error
