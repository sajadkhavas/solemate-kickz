name: P07 format diagnostic

on:
  push:
    branches:
      - "phase/sole-p07-payment-shipping-returns"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "phase/sole-p07-payment-shipping-returns"
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Apply exact Prettier formatting and remove diagnostic
        run: >-
          bunx prettier --write
          scripts/audit-p07-payment-shipping-returns.mjs
          scripts/test-p07-payment-shipping-returns.mjs
          src/auth/ProductionNavbar.tsx
          src/auth/ProductionFooter.tsx
          src/auth/ProductionMobileBottomNav.tsx
          src/commerce/ProductionCheckoutPage.tsx
          src/commerce/ProductionOrdersPage.tsx
          && rm .github/workflows/p07-format-diagnostic.yml
      - name: Commit exact formatter output
        run: |
          git config user.name "sole-ci"
          git config user.email "144109918+sajadkhavas@users.noreply.github.com"
          git add scripts/audit-p07-payment-shipping-returns.mjs \
            scripts/test-p07-payment-shipping-returns.mjs \
            src/auth/ProductionNavbar.tsx \
            src/auth/ProductionFooter.tsx \
            src/auth/ProductionMobileBottomNav.tsx \
            src/commerce/ProductionCheckoutPage.tsx \
            src/commerce/ProductionOrdersPage.tsx \
            .github/workflows/p07-format-diagnostic.yml
          git diff --cached --quiet && exit 0
          git commit -m "P07: apply exact Prettier output"
          git push origin HEAD:phase/sole-p07-payment-shipping-returns
