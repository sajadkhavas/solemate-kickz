name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - "phase/**"
      - "integration/**"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Source-contract audit
        run: bun run audit:source-contracts

      - name: Browser behavior tests
        run: bun run test:foundation

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Production build
        run: bun run build

      - name: Visual QA
        run: bun run qa:visual:f0-f1

      - name: Foundation completion audit
        run: bun run audit:f0-f1

      - name: Aggregate quality gate
        run: bun run check

      - name: Verify tracked working tree is clean
        run: test -z "$(git status --porcelain --untracked-files=no)"

      - name: Publish quality evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "## F0/F1 quality evidence"
            echo
            echo "- Exact commit: \`${GITHUB_SHA}\`"
            echo "- Node: \`22.23.1\`"
            echo "- Bun: \`1.3.14\`"
            echo "- Full command output remains available in this immutable workflow run."
            echo
            echo "### Generated reports"
          } >> "$GITHUB_STEP_SUMMARY"

          if find artifacts -maxdepth 3 -type f -print -quit 2>/dev/null | grep -q .; then
            find artifacts -maxdepth 3 -type f -printf '%p\n' 2>/dev/null |
              sort |
              sed 's/^/- `/' |
              sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No report files were generated before the failing step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload quality reports and screenshots
        if: ${{ always() && vars.ENABLE_QA_ARTIFACT_UPLOAD == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: f0-f1-visual-qa-screenshots
          overwrite: true
          compression-level: 9
          if-no-files-found: error
          retention-days: 1
          path: |
            artifacts/reports/
            artifacts/visual-qa/
