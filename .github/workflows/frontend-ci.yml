name: Temporary F0/F1 Formatter

on:
  push:
    branches:
      - "phase/sole-f0-f1-foundation"

permissions:
  contents: write

concurrency:
  group: temporary-f0-f1-formatter
  cancel-in-progress: true

jobs:
  format-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f0-f1-foundation
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Apply exact Foundation formatting
        run: bun run format:foundation

      - name: Commit formatting only
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/frontend-ci.yml \
            docs/frontend/SOLE_DESIGN_SYSTEM.md \
            docs/frontend/SOLE_FRONTEND_CONSTITUTION.md \
            docs/handoffs/F0-F1-FOUNDATION.md \
            eslint.config.js \
            package.json \
            scripts/audit-f0-f1-foundation.mjs \
            scripts/browser-harness.mjs \
            scripts/fixtures/foundation-behavior-entry.tsx \
            scripts/run-browser-check.mjs \
            scripts/test-f0-f1-behavior.mjs \
            scripts/test-f0-f1-primitives.mjs \
            scripts/visual-qa-f0-f1.mjs \
            src/components/CartDrawer.tsx \
            src/components/MagneticCursor.tsx \
            src/components/ShoeCard.tsx \
            src/components/sections/BrandWall.tsx \
            src/components/sections/Footer.tsx \
            src/components/ui/button.tsx \
            src/components/ui/commerce-primitives.tsx \
            src/foundation.css \
            src/routes/__root.tsx \
            src/routes/about.tsx \
            src/routes/brands.tsx \
            src/styles.css
          git commit -m "chore(format): apply exact F0-F1 formatting"
          git push origin HEAD:phase/sole-f0-f1-foundation
