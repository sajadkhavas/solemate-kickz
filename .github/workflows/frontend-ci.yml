name: F3 Locked Formatter

on:
  push:
    branches:
      - "phase/sole-f3-homepage"

permissions:
  contents: write

concurrency:
  group: f3-locked-formatter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Apply locked Prettier output
        shell: bash
        run: |
          files=(
            scripts/audit-f3-homepage.mjs
            scripts/test-f3-homepage.mjs
            scripts/visual-qa-f3-homepage.mjs
            src/components/ShoeViewer3D.tsx
            src/components/sections/Hero.tsx
            src/components/sections/HomeImage.tsx
            src/components/sections/HypeSection.tsx
            src/components/sections/TrustBadges.tsx
          )
          bunx prettier --write "${files[@]}"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "style(home): apply locked prettier formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
