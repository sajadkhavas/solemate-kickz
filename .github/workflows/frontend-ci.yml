name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - "phase/**"
      - "integration/**"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Source-contract audit
        run: bun run audit:source-contracts

      - name: Browser behavior tests
        run: bun run test:foundation

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Production build
        run: bun run build

      - name: Visual QA
        run: bun run qa:visual:f0-f1

      - name: Foundation completion audit
        run: bun run audit:f0-f1

      - name: Aggregate quality gate
        run: bun run check

      - name: Verify tracked working tree is clean
        run: test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload quality reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/reports/
            artifacts/runtime/
            artifacts/visual-qa/
