name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - "phase/**"
      - "integration/**"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Foundation source-contract audit
        run: bun run audit:source-contracts

      - name: Foundation browser behavior tests
        run: bun run test:foundation

      - name: Homepage completion audit
        run: node scripts/audit-f3-homepage.mjs

      - name: Homepage browser behavior tests
        run: node scripts/test-f3-homepage.mjs

      - name: Navigation and search completion audit
        run: bun run audit:f2

      - name: Navigation and search browser behavior tests
        run: bun run test:f2

      - name: Content pages completion audit
        run: bun run audit:f8

      - name: Content pages browser behavior tests
        run: bun run test:f8

      - name: F4-F5 catalog completion audit
        run: bun run audit:f4-f5

      - name: F4-F5 catalog browser behavior tests
        run: bun run test:f4-f5

      - name: F6 product detail completion audit
        run: bun run audit:f6

      - name: F6 product detail browser behavior tests
        run: bun run test:f6

      - name: F7 cart and checkout completion audit
        run: bun run audit:f7

      - name: F7 cart and checkout browser behavior tests
        run: bun run test:f7

      - name: F9 wishlist account and orders completion audit
        run: bun run audit:f9

      - name: F9 wishlist account and orders browser behavior tests
        run: bun run test:f9

      - name: F10 motion 3D interaction completion audit
        run: bun run audit:f10

      - name: F10 motion 3D interaction browser behavior tests
        run: bun run test:f10

      - name: F11 technical SEO completion audit
        run: bun run audit:f11

      - name: F11 SSR SEO runtime tests
        run: bun run test:f11

      - name: F11 SEO safety QA
        run: bun run qa:seo:f11

      - name: F12 performance/media source audit
        run: bun run audit:f12

      - name: F13 full-code source audit
        run: node scripts/audit-f13-full-code.mjs

      - name: F13 hardening browser behavior
        run: node scripts/test-f13-hardening.mjs

      - name: F14 PWA source audit
        run: bun run audit:f14

      - name: F14 PWA behavior contracts
        run: bun run test:f14

      - name: VPS deployment contract audit
        run: bun run audit:deploy

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Foundation and cumulative format check
        run: bun run format:check

      - name: Homepage format check
        run: >-
          bunx prettier --check
          .github/workflows/frontend-ci.yml
          docs/handoffs/F3-HOMEPAGE.md
          scripts/audit-f3-homepage.mjs
          scripts/test-f3-homepage.mjs
          scripts/visual-qa-f3-homepage.mjs
          src/components/ShoeViewer3D.tsx
          src/components/sections/BrandWall.tsx
          src/components/sections/Categories.tsx
          src/components/sections/FeaturedDrops.tsx
          src/components/sections/Hero.tsx
          src/components/sections/HomeImage.tsx
          src/components/sections/HypeSection.tsx
          src/components/sections/MerchandisingShowcase.tsx
          src/components/sections/Newsletter.tsx
          src/components/sections/QuickShopPaths.tsx
          src/components/sections/TrustBadges.tsx
          src/routes/index.tsx

      - name: F12 format check
        run: >-
          bunx prettier --check
          .github/workflows/frontend-ci.yml
          docs/handoffs/F12-PERFORMANCE-MEDIA.md
          package.json
          scripts/audit-f12-performance-media.mjs
          scripts/qa-f12-build-budgets.mjs
          scripts/verify-cumulative-quality.mjs
          src/components/ShoeCard.tsx
          src/components/product/ProductGallery.tsx
          src/data/shoes.ts
          src/routes/index.tsx

      - name: F13 format check
        run: >-
          bunx prettier --check
          .github/workflows/frontend-ci.yml
          docs/handoffs/F13-FULL-CODE-AUDIT-HARDENING.md
          scripts/audit-f13-full-code.mjs
          scripts/test-f13-hardening.mjs
          scripts/verify-cumulative-quality.mjs
          src/cart/cart-domain.ts
          src/catalog/catalog-state.ts
          src/components/product/ProductPurchasePanel.tsx
          src/lib/error-page.ts
          src/server.ts
          src/store/index.ts

      - name: F14 format check
        run: >-
          bunx prettier --check
          .github/workflows/frontend-ci.yml
          docs/handoffs/F14-PWA-FOUNDATION.md
          package.json
          public/manifest.webmanifest
          public/offline.html
          public/sw.js
          scripts/audit-f14-pwa.mjs
          scripts/test-f14-pwa.mjs
          scripts/verify-cumulative-quality.mjs
          src/components/pwa/PwaExperience.tsx
          src/routes/__root.tsx
          src/styles.css

      - name: Production build
        run: bun run build

      - name: F12 build performance budgets
        run: bun run qa:perf:f12

      - name: VPS Node-server build
        run: bun run build:vps

      - name: Foundation Visual QA
        run: bun run qa:visual:f0-f1

      - name: Navigation and search Visual QA
        run: bun run qa:visual:f2

      - name: Content pages Visual QA
        run: bun run qa:visual:f8

      - name: Homepage Visual QA
        run: node scripts/visual-qa-f3-homepage.mjs

      - name: F4-F5 catalog Visual QA
        run: bun run qa:visual:f4-f5

      - name: F6 product detail Visual QA
        run: bun run qa:visual:f6

      - name: F7 cart and checkout Visual QA
        run: bun run qa:visual:f7

      - name: F9 wishlist account and orders Visual QA
        run: bun run qa:visual:f9

      - name: F10 motion 3D interaction Visual QA
        run: bun run qa:visual:f10

      - name: Foundation completion audit
        run: bun run audit:f0-f1

      - name: Aggregate cumulative evidence verification
        run: bun run verify:cumulative

      - name: Verify working tree is clean
        shell: bash
        run: |
          git status --short
          test -z "$(git status --short)"

      - name: Publish quality evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Cumulative frontend quality evidence"
            echo
            echo "- Exact commit: \`${GITHUB_SHA}\`"
            echo "- Node: \`22.23.1\`"
            echo "- Bun: \`1.3.14\`"
            echo "- Included phases: F0/F1, F3 + commercial homepage upgrade, F2, F8, F4/F5, F6, F7, F9, F10, F11, F12, F13 and F14"
            echo "- F12 source contracts and deterministic client build budgets are enforced."
            echo "- F13 full-code inventory, hardening contracts and malformed-state browser regression are enforced."
            echo "- Deployment contract audit + Node-server build are also enforced."
            echo "- Every browser, visual and SEO runtime suite runs once; the final verifier reads their generated JSON evidence."
            echo
            echo "### Generated reports"
          } >> "$GITHUB_STEP_SUMMARY"

          if find artifacts -maxdepth 4 -type f -print -quit 2>/dev/null | grep -q .; then
            find artifacts -maxdepth 4 -type f -printf '%p\n' 2>/dev/null |
              sort |
              sed 's/^/- `/' |
              sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No report files were generated before the failing step." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload quality reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cumulative-frontend-quality-evidence
          overwrite: true
          compression-level: 9
          if-no-files-found: warn
          retention-days: 1
          path: |
            artifacts/audits/
            artifacts/reports/
            artifacts/visual-qa/
            artifacts/runtime/
