name: Temporary F4-F5 Visual Stability Finalizer

on:
  push:
    branches:
      - phase/sole-f4-f5-catalog-product-card
    paths:
      - .github/workflows/f4-f5-visual-stability-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f4-f5-catalog-product-card
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Apply stable visual contract and clean diagnostics
        run: |
          python3 scripts/patch-f4-f5-visual-stability.py
          bunx prettier --write scripts/visual-qa-f4-f5-catalog-product-card.mjs
          rm scripts/patch-f4-f5-visual-stability.py
          rm .github/workflows/f4-f5-visual-report-temporary.yml
          rm .github/workflows/f4-f5-visual-stability-finalizer.yml

      - name: Commit corrected visual contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(qa): stabilize catalog visual validation"
          git push origin HEAD:phase/sole-f4-f5-catalog-product-card
