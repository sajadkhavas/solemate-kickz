name: F11 stabilize F10 visual once

on:
  push:
    branches:
      - phase/sole-f11-technical-seo

permissions:
  contents: write

concurrency:
  group: f11-stabilize-f10-visual-once
  cancel-in-progress: true

jobs:
  verify-and-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out F11 branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f11-technical-seo
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Stabilize F10 visual readiness and harden F11 proof
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          visual_path = Path('scripts/visual-qa-f10-motion-3d.mjs')
          visual = visual_path.read_text()
          old = '''  await waitForExpression(\n    client,\n    `document.querySelector('main h1') || document.querySelector('[data-testid="home-hero"] h1')`,\n  );'''
          new = '''  await waitForExpression(\n    client,\n    `document.querySelector('main') || document.querySelector('#main-content')`,\n  );'''
          if old not in visual:
              raise SystemExit('F10 readiness anchor missing')
          visual = visual.replace(old, new, 1)
          visual_path.write_text(visual)

          audit_path = Path('scripts/audit-f11-technical-seo.mjs')
          audit = audit_path.read_text()

          phase_anchor = '  "scripts/visual-qa-f7-cart-checkout.mjs",\n'
          phase_line = '  "scripts/visual-qa-f10-motion-3d.mjs",\n'
          phase_section = audit.split('const FORMAT_CLEANUP_FILES', 1)[0]
          if phase_line not in phase_section:
              if phase_anchor not in audit:
                  raise SystemExit('F10 PHASE_FILES anchor missing')
              audit = audit.replace(phase_anchor, phase_anchor + phase_line, 1)

          read_anchor = 'const f7Visual = read("scripts/visual-qa-f7-cart-checkout.mjs");\n'
          read_line = 'const f10Visual = read("scripts/visual-qa-f10-motion-3d.mjs");\n'
          if read_line not in audit:
              if read_anchor not in audit:
                  raise SystemExit('F10 read anchor missing')
              audit = audit.replace(read_anchor, read_anchor + read_line, 1)

          record_anchor = '''record(\n  "F7 visual QA reseeds cart and checkout draft before stateful review capture",'''
          proof = '''record(\n  "F10 visual readiness waits for the rendered page landmark while preserving h1 assertions",\n  f10Visual.includes("document.querySelector('main') || document.querySelector('#main-content')") &&\n    f10Visual.includes("if (metrics.h1 !== 1) findings.push(`h1-count-${metrics.h1}`)"),\n  null,\n);\n\n'''
          if 'F10 visual readiness waits for the rendered page landmark while preserving h1 assertions' not in audit:
              if record_anchor not in audit:
                  raise SystemExit('F10 proof anchor missing')
              audit = audit.replace(record_anchor, proof + record_anchor, 1)

          audit_path.write_text(audit)
          PY

          bunx prettier --write scripts/visual-qa-f10-motion-3d.mjs scripts/audit-f11-technical-seo.mjs

      - name: Prove F10 Visual QA before commit
        run: bun run qa:visual:f10

      - name: Commit verified F10 visual stabilization and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/f11-stabilize-f10-visual-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Stabilize F10 visual page readiness"
          git push origin HEAD:phase/sole-f11-technical-seo
