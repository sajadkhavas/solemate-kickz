name: F11 stabilize F6 visual once

on:
  push:
    branches:
      - phase/sole-f11-technical-seo

permissions:
  contents: write

concurrency:
  group: f11-stabilize-f6-visual-once
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out F11 branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f11-technical-seo
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Stabilize fallback visual proof and harden F11 gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          visual_path = Path('scripts/visual-qa-f6-product-detail.mjs')
          visual = visual_path.read_text()

          inspect_anchor = '''async function inspect(client) {\n'''
          helper = '''async function ensureMainImageFallback(client) {\n  const triggered = await evaluate(\n    client,\n    `(() => {\n      if (document.querySelector('[data-testid="product-main-image-fallback"]')) return true;\n      const image = document.querySelector('[data-testid="product-main-image"]');\n      if (!(image instanceof HTMLImageElement)) return false;\n      image.dispatchEvent(new Event('error'));\n      return true;\n    })()`,\n  );\n  if (!triggered) throw new Error("Main product image or fallback was not found");\n  await waitForExpression(\n    client,\n    `document.querySelector('[data-testid="product-main-image-fallback"]')`,\n  );\n}\n\n'''
          if 'async function ensureMainImageFallback' not in visual:
              if inspect_anchor not in visual:
                  raise SystemExit('inspect anchor missing')
              visual = visual.replace(inspect_anchor, helper + inspect_anchor, 1)

          capture_anchor = '''  if (setup) await setup();\n  await sleep(650);\n\n  const metrics = await inspect(client);\n'''
          capture_new = '''  if (setup) await setup();\n  await ensureMainImageFallback(client);\n  await sleep(650);\n\n  const metrics = await inspect(client);\n'''
          if '  await ensureMainImageFallback(client);\n' not in visual:
              if capture_anchor not in visual:
                  raise SystemExit('capture anchor missing')
              visual = visual.replace(capture_anchor, capture_new, 1)
          visual_path.write_text(visual)

          audit_path = Path('scripts/audit-f11-technical-seo.mjs')
          audit = audit_path.read_text()
          phase_anchor = '  "scripts/test-f7-cart-checkout.mjs",\n'
          phase_line = '  "scripts/visual-qa-f6-product-detail.mjs",\n'
          phase_section = audit.split('const FORMAT_CLEANUP_FILES', 1)[0]
          if phase_line not in phase_section:
              if phase_anchor not in audit:
                  raise SystemExit('PHASE_FILES script anchor missing')
              audit = audit.replace(phase_anchor, phase_anchor + phase_line, 1)

          read_anchor = 'const f7Behavior = read("scripts/test-f7-cart-checkout.mjs");\n'
          read_line = 'const f6Visual = read("scripts/visual-qa-f6-product-detail.mjs");\n'
          if read_line not in audit:
              if read_anchor not in audit:
                  raise SystemExit('read anchor missing')
              audit = audit.replace(read_anchor, read_line + read_anchor, 1)

          record_anchor = '''record(\n  "F7 behavior test verifies selected-size commit before add",'''
          proof = '''record(\n  "F6 fallback visual QA deterministically exercises image-error fallback",\n  f6Visual.includes("async function ensureMainImageFallback") &&\n    f6Visual.includes("image.dispatchEvent(new Event('error'))") &&\n    f6Visual.includes("await ensureMainImageFallback(client)") &&\n    f6Visual.includes('product-main-image-fallback'),\n  null,\n);\n\n'''
          if 'F6 fallback visual QA deterministically exercises image-error fallback' not in audit:
              if record_anchor not in audit:
                  raise SystemExit('F7 proof anchor missing')
              audit = audit.replace(record_anchor, proof + record_anchor, 1)

          audit_path.write_text(audit)
          PY

          bunx prettier --write scripts/visual-qa-f6-product-detail.mjs scripts/audit-f11-technical-seo.mjs

      - name: Commit deterministic F6 visual fallback proof
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/visual-qa-f6-product-detail.mjs scripts/audit-f11-technical-seo.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Stabilize F6 image fallback visual QA"
          git push origin HEAD:phase/sole-f11-technical-seo
