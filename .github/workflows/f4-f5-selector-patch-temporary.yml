name: Temporary F4-F5 Selector Patch

on:
  push:
    branches:
      - "phase/sole-f4-f5-catalog-product-card"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/sole-f4-f5-catalog-product-card
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Patch exact size selector
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/test-f4-f5-catalog-product-card.mjs")
          text = path.read_text()
          old = '''    await clickText(client, '[data-testid="catalog-filters"] button', "42");'''
          new = '''    await evaluate(
      client,
      `([...document.querySelectorAll('[data-testid="catalog-filters"] button')]
        .find((button) => button.textContent?.trim() === '42'))?.click()`,
    );'''
          if old not in text:
              raise SystemExit("Size selector block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          bunx prettier --write scripts/test-f4-f5-catalog-product-card.mjs
      - name: Commit if needed
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-f4-f5-catalog-product-card.mjs
          git commit -m "test(catalog): target exact size control"
          git push origin HEAD:phase/sole-f4-f5-catalog-product-card
