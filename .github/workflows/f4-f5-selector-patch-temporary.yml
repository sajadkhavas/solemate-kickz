name: Temporary F4-F5 Selector Patch

on:
  push:
    branches:
      - "phase/sole-f4-f5-catalog-product-card"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f4-f5-catalog-product-card
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install
        run: bun install --frozen-lockfile

      - name: Apply exact size selector patch
        run: |
          python3 scripts/patch-f4-f5-size-test.py
          bunx prettier --write scripts/test-f4-f5-catalog-product-card.mjs
          rm scripts/patch-f4-f5-size-test.py

      - name: Commit verified patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-f4-f5-catalog-product-card.mjs
          git add -u scripts/patch-f4-f5-size-test.py
          git commit -m "test(catalog): target exact size control"
          git push origin HEAD:phase/sole-f4-f5-catalog-product-card
