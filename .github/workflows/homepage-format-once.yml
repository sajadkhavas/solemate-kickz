name: Homepage format once

on:
  push:
    branches:
      - phase/sole-f3-homepage-commercial-upgrade
    paths:
      - .github/workflows/homepage-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/sole-f3-homepage-commercial-upgrade
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - run: bun install --frozen-lockfile

      - name: Format exact homepage files
        run: |
          bunx prettier --write \
            scripts/audit-f3-homepage.mjs \
            src/components/sections/MerchandisingShowcase.tsx \
            src/components/sections/QuickShopPaths.tsx
          rm .github/workflows/homepage-format-once.yml

      - name: Commit formatting-only cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-f3-homepage.mjs src/components/sections/MerchandisingShowcase.tsx src/components/sections/QuickShopPaths.tsx .github/workflows/homepage-format-once.yml
          git commit -m "Format homepage commercial upgrade"
          git push origin HEAD:phase/sole-f3-homepage-commercial-upgrade
