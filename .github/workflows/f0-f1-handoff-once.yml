name: F0/F1 Guarded Handoff Finalizer

on:
  push:
    branches:
      - phase/sole-f0-f1-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: f0-f1-guarded-handoff
  cancel-in-progress: true

jobs:
  handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out latest mission branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f0-f1-foundation
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify baseline and recorded gates
        shell: bash
        run: |
          set -Eeuo pipefail
          baseline='137344f1d89373a55e3bf4bb4d82b48d8247b45f'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$baseline"

          grep -qx 'install=0' artifacts/validation/status.txt
          grep -qx 'audit=0' artifacts/validation/status.txt
          grep -qx 'tests=0' artifacts/validation/status.txt
          grep -qx 'typecheck=0' artifacts/validation/status.txt
          grep -qx 'lint=0' artifacts/validation/status.txt
          grep -qx 'build=0' artifacts/validation/status.txt
          grep -qx 'visual_qa=0' artifacts/validation/status.txt
          grep -qx 'format_check=0' artifacts/validation/status.txt
          grep -qx 'check=0' artifacts/validation/status.txt
          grep -qx 'overall=0' artifacts/validation/status.txt

          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/visual-qa/f0-f1-visual-qa.json').read_text(encoding='utf-8'))
          summary = report.get('summary', {})
          assert report.get('pass') is True
          expected = {
              'screenshots': 72,
              'routes': 8,
              'viewports': 9,
              'criticalFindings': 0,
              'horizontalOverflowCases': 0,
              'hydrationWarningCases': 0,
              'runtimeErrorCases': 0,
              'sameOriginNetworkErrorCases': 0,
          }
          for key, value in expected.items():
              assert summary.get(key) == value, (key, summary.get(key), value)
          PY

      - name: Install from unchanged lockfile
        run: bun install --frozen-lockfile

      - name: Generate exact handoff from repository evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          baseline = '137344f1d89373a55e3bf4bb4d82b48d8247b45f'
          implementation_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          commits = subprocess.check_output(
              ['git', 'log', '--reverse', '--format=%H %s', f'{baseline}..HEAD'], text=True
          ).strip().splitlines()
          files = subprocess.check_output(
              ['git', 'diff', '--name-status', f'{baseline}...HEAD'], text=True
          ).strip().splitlines()
          visual = json.loads(Path('artifacts/visual-qa/f0-f1-visual-qa.json').read_text(encoding='utf-8'))
          summary = visual['summary']
          reduced = visual.get('reducedMotion') or {}
          zoom = visual.get('zoom200') or []
          external = visual.get('externalNetworkFindings') or []
          status = Path('artifacts/validation/status.txt').read_text(encoding='utf-8').strip().splitlines()
          lock_changed = subprocess.run(
              ['git', 'diff', '--quiet', f'{baseline}...HEAD', '--', 'bun.lock']
          ).returncode != 0

          changed_components = [
              'Root document and route accessibility manager',
              'Button',
              'CartDrawer',
              'MagneticCursor',
              'ShoeCard structural interaction integrity',
              'BrandWall and Footer foundation integrity',
              'About and Brands truthfulness/landmark repairs',
              'Commerce primitives: IconButton, TextLink, SearchInput, Price, DiscountPrice, StockState, QuantityStepper, Spinner, EmptyState, ErrorState, VisuallyHidden',
          ]

          lines = [
              '# F0/F1 Foundation Handoff',
              '',
              '## Repository',
              '',
              '`sajadkhavas/solemate-kickz`',
              '',
              '## Branch',
              '',
              '`phase/sole-f0-f1-foundation`',
              '',
              '## Baseline',
              '',
              f'`{baseline}`',
              '',
              '## Validated implementation commit',
              '',
              f'`{implementation_sha}`',
              '',
              'The final documentation commit is the branch head created after this handoff file is generated and is reported in the supervising chat.',
              '',
              '## Baseline findings',
              '',
              '- The required `main` baseline matched exactly before branch creation and again before final handoff.',
              '- Frozen-lockfile install passed with Node `v22.23.1`, Bun `1.3.14`, and `bun.lock`.',
              '- Baseline TypeScript and production build passed.',
              '- Baseline lint failed because repository-wide Prettier differences were enforced as ESLint errors; the repository was not globally reformatted.',
              '- Root language/direction, focus, reduced motion, overlay semantics, truthfulness, and shared commerce contracts were incomplete.',
              '- The existing 3D model is approximately 8 MB and remains optional/lazy by constitution.',
              '',
              '## Constitution decisions',
              '',
              '- Persian RTL is a first-class product requirement.',
              '- Cinematic motion is limited to storytelling surfaces; transactional routes remain low-friction.',
              '- Semantic tokens and role-based component contracts are normative.',
              '- Demo commerce facts must be labeled and must not be presented as verified business truth.',
              '- Accessibility, performance, SEO, and truthful data ownership are release gates, not polish tasks.',
              '',
              '## Design-system decisions',
              '',
              '- Existing React, TanStack Start, TypeScript, Tailwind, Vite, Radix, and Shadcn foundations were retained.',
              '- No framework migration or dependency upgrade was performed.',
              '- Semantic tokens coexist with temporary visual aliases to prevent page-phase regressions.',
              '- RootShell owns the stable skip/focus target; route transitions focus it without hydration-time DOM mutation.',
              '- Radix Dialog owns the shared cart overlay focus, Escape, scroll-lock, restoration, and labeling contract.',
              '- `Button asChild` preserves Radix single-child semantics.',
              '',
              '## Files changed',
              '',
          ]
          lines.extend(f'- `{entry}`' for entry in files)
          lines.extend([
              '',
              '## Components created or changed',
              '',
          ])
          lines.extend(f'- {entry}' for entry in changed_components)
          lines.extend([
              '',
              '## Dependencies changed',
              '',
              'None. Dependency versions were not changed and `bun.lock` remained unchanged.' if not lock_changed else 'Unexpected lockfile change detected; supervisor review required.',
              '',
              '## Commands executed',
              '',
              '- `bun install --frozen-lockfile`',
              '- `bun run audit:f0-f1`',
              '- `bun run test:foundation`',
              '- `bun run typecheck`',
              '- `bun run lint`',
              '- `bun run build`',
              '- `bun run format:check`',
              '- `bun run check`',
              '- `bun run qa:visual:f0-f1` against the SSR application',
              '',
              '## Aggregate command results',
              '',
          ])
          lines.extend(f'- `{entry}`' for entry in status)
          lines.extend([
              '',
              '## Audit results',
              '',
              '- Permanent audit: pass.',
              '- Machine-readable report: `artifacts/audits/f0-f1-foundation.json`.',
              '',
              '## Unit-test results',
              '',
              '- Foundation primitive contract tests: pass.',
              '',
              '## Typecheck result',
              '',
              '- Pass.',
              '',
              '## Lint result',
              '',
              '- Pass with no errors.',
              '',
              '## Production build result',
              '',
              '- Pass. Nitro generated the Cloudflare-module production output.',
              '',
              '## Routes visually inspected',
              '',
              '- `/`',
              '- `/products`',
              '- `/product/1`',
              '- `/cart`',
              '- `/auth`',
              '- `/brands`',
              '- `/about`',
              '- `/route-that-does-not-exist`',
              '',
              '## Viewports inspected',
              '',
              '- 320×568',
              '- 375×812',
              '- 390×844',
              '- 430×932',
              '- 768×1024',
              '- 1024×768',
              '- 1280×800',
              '- 1440×900',
              '- 1920×1080',
              '',
              '## Visual QA evidence',
              '',
              f'- Screenshots: {summary.get("screenshots")} ({summary.get("routes")} routes × {summary.get("viewports")} viewports).',
              f'- Critical findings: {summary.get("criticalFindings")}.',
              f'- Horizontal overflow cases: {summary.get("horizontalOverflowCases")}.',
              f'- Hydration warning cases: {summary.get("hydrationWarningCases")}.',
              f'- Runtime error cases: {summary.get("runtimeErrorCases")}.',
              f'- Same-origin network error cases: {summary.get("sameOriginNetworkErrorCases")}.',
              f'- External CDN/network observations: {summary.get("externalNetworkErrorCases", len(external))}; recorded separately and not hidden.',
              '- After screenshot report: `artifacts/visual-qa/f0-f1-visual-qa.json`.',
              '- After screenshot manifest: `artifacts/visual-qa/manifest.txt`.',
              '- Screenshot artifact: `f0-f1-final-visual-qa-screenshots`.',
              '- Exact baseline screenshot artifact: `f0-f1-baseline-visual-qa` (read-only checkout of the required baseline).',
              '',
              '## Accessibility verification',
              '',
              '- Keyboard: five sequential Tab samples per route/viewport were recorded; controls retain visible focus.',
              '- Focus: stable SSR skip target and route focus restoration pass without hydration mutation.',
              '- Reduced motion: CSS foundation and Framer Motion `reducedMotion="user"` are active.',
              f'- Reduced-motion automated observation: `{json.dumps(reduced, ensure_ascii=False)}`.',
              f'- Zoom: {len(zoom)} route observations at browser page scale 200% were recorded.',
              '- Screen-reader semantics: landmarks, route announcement, dialog title/description, accessible names, and mixed-direction price isolation are implemented.',
              '',
              '## Performance observations',
              '',
              '- Remote render-blocking Google Fonts stylesheet was removed.',
              '- Custom cursor is disabled for coarse pointers/reduced motion, contains its fixed visual inside the viewport, and cleans up listeners/RAF.',
              '- 3D remains non-required for initial foundation rendering.',
              '- Route-specific image delivery and Core Web Vitals measurement remain later-phase responsibilities.',
              '',
              '## Known limitations',
              '',
              '- Automated screenshots do not replace human aesthetic review or testing with a physical screen reader/touch device.',
              '- External CDN failures are retained as separate evidence because CI network policy may differ from production.',
              '- Page-specific product, stock, pricing, search, wishlist, checkout, and trust data remain demo/out of scope until their owning phases connect verified sources.',
              '',
              '## Out-of-scope findings for later phases',
              '',
              '- F2: navigation architecture, full search overlay behavior, and mobile navigation refinement.',
              '- F3: homepage storytelling, claim ownership, newsletter behavior, and section-specific motion.',
              '- F4/F5: catalog filters, product-card/PDP specialization, variants, product media, and filtered URL SEO.',
              '- F6: cart business rules and checkout-adjacent states.',
              '- F7: authentication flows and form validation.',
              '- F8: wishlist/account persistence.',
              '- F9: brand editorial content and canonical ownership.',
              '- F10: verified contact, legal, trust, and business identity content.',
              '- F11: image delivery, 3D optimization, route budgets, and Core Web Vitals.',
              '- F12: final cross-route production audit.',
              '',
              '## Commit list',
              '',
          ])
          lines.extend(f'- `{entry}`' for entry in commits)
          lines.extend([
              '',
              '## Working tree',
              '',
              '- The handoff workflow commits all tracked source/evidence changes and pushes a clean branch state.',
              '',
              '## Ready for supervisor review',
              '',
              'yes',
              '',
          ])

          Path('docs/handoffs').mkdir(parents=True, exist_ok=True)
          Path('docs/handoffs/F0-F1-FOUNDATION.md').write_text('\n'.join(lines), encoding='utf-8')
          Path('artifacts/validation/handoff-parent.txt').write_text(
              f'validated_implementation_commit={implementation_sha}\n', encoding='utf-8'
          )
          PY

      - name: Re-run aggregate static gate with final handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          bun run check > artifacts/validation/handoff-check.txt 2>&1

      - name: Remove one-shot and temporary files
        shell: bash
        run: |
          rm -f \
            .github/workflows/f0-f1-handoff-once.yml \
            .github/workflows/f0-f1-finalize-once.yml \
            .github/workflows/f0-f1-finalize-corrected.yml \
            src/routes/__root.next.tsx \
            tmp-test-do-not-use

      - name: Commit and push final handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f artifacts/validation artifacts/audits artifacts/visual-qa/f0-f1-visual-qa.json artifacts/visual-qa/manifest.txt
          git commit -m "docs(handoff): finalize F0-F1 evidence"
          git push origin HEAD:phase/sole-f0-f1-foundation
