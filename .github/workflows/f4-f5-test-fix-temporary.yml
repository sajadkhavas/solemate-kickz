name: Temporary F4-F5 Test Fix

on:
  push:
    branches:
      - "phase/sole-f4-f5-catalog-product-card"

permissions:
  contents: write

concurrency:
  group: temporary-f4-f5-test-fix
  cancel-in-progress: true

jobs:
  patch-test-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/sole-f4-f5-catalog-product-card
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - run: bun install --frozen-lockfile

      - name: Use native form submission
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("scripts/test-f4-f5-catalog-product-card.mjs")
          text = path.read_text()
          old = '''    await setInput(client, "#catalog-search", "Nike");
    await press(client, "Enter", "Enter");
    await waitForExpression(client, `new URLSearchParams(location.search).get('q') === 'Nike'`);'''
          new = '''    await setInput(client, "#catalog-search", "Nike");
    await evaluate(
      client,
      `document.querySelector('#catalog-search')?.closest('form')?.requestSubmit()`,
    );
    await waitForExpression(client, `new URLSearchParams(location.search).get('q') === 'Nike'`);'''
          if old not in text:
              raise SystemExit("Expected search submission block not found")
          path.write_text(text.replace(old, new))
          PY
          bunx prettier --write scripts/test-f4-f5-catalog-product-card.mjs

      - name: Verify browser suite twice
        run: |
          bun run test:f4-f5
          bun run test:f4-f5

      - name: Commit verified test correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-f4-f5-catalog-product-card.mjs
          git commit -m "test(catalog): use native form submission"
          git push origin HEAD:phase/sole-f4-f5-catalog-product-card
