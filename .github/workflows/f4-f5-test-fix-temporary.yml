name: Temporary F4-F5 Test Patch

on:
  push:
    branches:
      - "phase/sole-f4-f5-catalog-product-card"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f4-f5-catalog-product-card
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install
        run: bun install --frozen-lockfile

      - name: Apply native form submission test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/test-f4-f5-catalog-product-card.mjs")
          text = path.read_text()
          text = text.replace(
              '    await press(client, "Enter", "Enter");\n',
              '    await evaluate(\n      client,\n      `document.querySelector(\'#catalog-search\')?.closest(\'form\')?.requestSubmit()`,\n    );\n',
              1,
          )
          path.write_text(text)
          PY
          bunx prettier --write scripts/test-f4-f5-catalog-product-card.mjs

      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-f4-f5-catalog-product-card.mjs
          git commit -m "test(catalog): use native form submission"
          git push origin HEAD:phase/sole-f4-f5-catalog-product-card
