name: F11 format F3 once

on:
  push:
    branches:
      - phase/sole-f11-technical-seo

permissions:
  contents: write

concurrency:
  group: f11-format-f3-once
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out F11 branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f11-technical-seo
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Format only F3 homepage audit
        run: bunx prettier --write scripts/audit-f3-homepage.mjs

      - name: Commit formatting-only cleanup and remove helper
        shell: bash
        run: |
          rm -f .github/workflows/f11-format-f3-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-f3-homepage.mjs .github/workflows/f11-format-f3-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "Normalize F3 homepage audit formatting"
          git push origin HEAD:phase/sole-f11-technical-seo
