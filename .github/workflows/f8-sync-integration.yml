name: Temporary F8 Integration Sync

on:
  push:
    branches:
      - "phase/sole-f8-content-pages"

permissions:
  contents: write

concurrency:
  group: temporary-f8-integration-sync
  cancel-in-progress: true

jobs:
  sync-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out F8 branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f8-content-pages
          fetch-depth: 0

      - name: Merge latest approved Integration baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin integration/sole-frontend-v2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-ff --no-commit origin/integration/sole-frontend-v2
          merge_status=$?
          set -e

          mapfile -t conflicted < <(git diff --name-only --diff-filter=U)
          for file in "${conflicted[@]}"; do
            if [[ "$file" != "package.json" ]]; then
              echo "Unexpected merge conflict: $file" >&2
              exit 1
            fi
          done

          python3 <<'PY'
          import json
          import shlex
          import subprocess
          from pathlib import Path

          def show(ref, path):
              return subprocess.check_output(["git", "show", f"{ref}:{path}"], text=True)

          integration = json.loads(show("origin/integration/sole-frontend-v2", "package.json"))
          f8 = json.loads(show("HEAD", "package.json"))

          scripts = dict(integration["scripts"])
          for key in ("audit:f8", "test:f8", "qa:visual:f8", "format:f8"):
              scripts[key] = f8["scripts"][key]

          scripts["check"] = (
              "bun run audit:f0-f1 && bun run audit:f2 && bun run audit:f8 && "
              "bun run audit:source-contracts && bun run test:foundation && "
              "bun run test:f2 && bun run test:f8 && bun run typecheck && "
              "bun run lint && bun run format:check && bun run build && "
              "bun run qa:visual:f0-f1 && bun run qa:visual:f2 && bun run qa:visual:f8"
          )

          def prettier_paths(command, prefix):
              tokens = shlex.split(command)
              if tokens[:2] != ["prettier", prefix]:
                  raise SystemExit(f"Unexpected Prettier command: {command}")
              return tokens[2:]

          integration_paths = prettier_paths(integration["scripts"]["format:check"], "--check")
          f8_paths = prettier_paths(f8["scripts"]["format:check"], "--check")
          combined = list(dict.fromkeys([*integration_paths, *f8_paths]))
          scripts["format:check"] = "prettier --check " + " ".join(shlex.quote(p) for p in combined)

          merged = dict(integration)
          merged["scripts"] = scripts
          Path("package.json").write_text(json.dumps(merged, ensure_ascii=False, indent=2) + "\n")

          handoff = Path("docs/handoffs/F8-CONTENT-PAGES.md")
          text = handoff.read_text()
          text = text.replace(
              "- Brand logos use the Simple Icons CDN only for slugs already declared by the Dataset; a text mark is the functional fallback.",
              "- Brand identity uses deterministic local text marks; no external brand-logo CDN is required.",
          )
          handoff.write_text(text)
          PY

          git add package.json docs/handoffs/F8-CONTENT-PAGES.md

          if [[ $merge_status -ne 0 ]] && [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved merge conflicts remain." >&2
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git commit -m "chore(integration): sync F8 with approved F2 and F3 baseline"
          git push origin HEAD:phase/sole-f8-content-pages
