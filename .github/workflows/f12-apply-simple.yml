name: F12 Apply Simple

on:
  push:
    branches:
      - phase/sole-f12-performance-media

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/sole-f12-performance-media
          fetch-depth: 0
      - name: Apply source changes and commit
        run: |
          python scripts/f12-apply-retry.py
          git checkout HEAD -- .github/workflows/frontend-ci.yml
          rm -f scripts/f12-apply-retry.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement F12 performance and media optimization"
          git push origin HEAD:phase/sole-f12-performance-media
