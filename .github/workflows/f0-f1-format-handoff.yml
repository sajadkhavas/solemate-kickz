name: F0/F1 Handoff Format Diff

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Print exact Prettier diff
        shell: bash
        run: |
          bunx prettier --write docs/handoffs/F0-F1-FOUNDATION.md
          echo '--- BEGIN HANDOFF PRETTIER DIFF ---'
          git --no-pager diff --no-ext-diff --unified=3 -- docs/handoffs/F0-F1-FOUNDATION.md
          echo '--- END HANDOFF PRETTIER DIFF ---'
