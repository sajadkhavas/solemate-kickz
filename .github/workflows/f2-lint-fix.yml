name: Temporary F2 Lint Fix

on:
  push:
    branches:
      - "phase/sole-f2-navigation-search"

permissions:
  contents: write

concurrency:
  group: temporary-f2-lint-fix
  cancel-in-progress: true

jobs:
  patch-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out F2 branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f2-navigation-search
          fetch-depth: 0

      - name: Remove obsolete audit variable
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("scripts/audit-f2-navigation-search.mjs")
          text = path.read_text()
          target = 'const shellSource = Object.values(files).join("\\n");\n'
          if target not in text:
              raise SystemExit("Obsolete shellSource declaration not found")
          path.write_text(text.replace(target, ""))
          PY

      - name: Commit lint correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-f2-navigation-search.mjs
          git commit -m "fix(lint): remove obsolete F2 audit aggregate"
          git push origin HEAD:phase/sole-f2-navigation-search
