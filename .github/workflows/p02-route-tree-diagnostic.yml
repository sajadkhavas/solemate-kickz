name: P02 Route Tree Diagnostic

on:
  push:
    branches:
      - "phase/sole-p02-media-catalog-ingestion"

permissions:
  contents: read

jobs:
  route-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Generate and compare route tree
        shell: bash
        run: |
          set -euo pipefail
          bun run build > /tmp/p02-route-tree-build.log 2>&1 || {
            cat /tmp/p02-route-tree-build.log
            exit 1
          }

          if git diff --quiet -- src/routeTree.gen.ts; then
            echo "routeTree.gen.ts is reproducible"
            exit 0
          fi

          echo "::group::Exact generated route tree diff"
          git diff --no-ext-diff -- src/routeTree.gen.ts
          echo "::endgroup::"
          exit 1
