name: Temporary F4-F5 Explicit Navigation

on:
  push:
    branches:
      - "phase/sole-f4-f5-catalog-product-card"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/sole-f4-f5-catalog-product-card
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Apply patch
        run: |
          python3 scripts/patch-f4-f5-explicit-navigation.py
          bunx prettier --write src/routes/products.tsx
          rm scripts/patch-f4-f5-explicit-navigation.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/products.tsx
          git add -u scripts/patch-f4-f5-explicit-navigation.py
          git commit -m "fix(catalog): make URL state navigation explicit"
          git push origin HEAD:phase/sole-f4-f5-catalog-product-card
