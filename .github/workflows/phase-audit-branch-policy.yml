name: Temporary Phase Audit Branch Policy

on:
  push:
    branches:
      - "phase/sole-f8-content-pages"

permissions:
  contents: write

concurrency:
  group: temporary-phase-audit-branch-policy
  cancel-in-progress: true

jobs:
  patch-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out F8 branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f8-content-pages
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Make inherited phase audits integration-safe
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          f2 = Path("scripts/audit-f2-navigation-search.mjs")
          text = f2.read_text()
          text = text.replace(
              'const EXPECTED_BRANCH = "phase/sole-f2-navigation-search";\n',
              'const OWNER_BRANCH = "phase/sole-f2-navigation-search";\n'
              'const INTEGRATION_BRANCH = "integration/sole-frontend-v2";\n'
              'const CONTROLLED_PHASE = /^phase\\/sole-f(?:\\d+)(?:-f\\d+)?-[a-z0-9-]+$/;\n'
              'const CONTROLLED_RELEASE = /^release\\/sole-frontend-v2(?:-|$)/;\n',
          )
          old = 'add("expected branch", branch === EXPECTED_BRANCH, { expected: EXPECTED_BRANCH, actual: branch });'
          new = '''const controlledBranch =\n  branch === OWNER_BRANCH ||\n  branch === INTEGRATION_BRANCH ||\n  CONTROLLED_PHASE.test(branch) ||\n  CONTROLLED_RELEASE.test(branch);\nadd("controlled phase or integration branch", controlledBranch, {\n  owner: OWNER_BRANCH,\n  integration: INTEGRATION_BRANCH,\n  actual: branch,\n});'''
          if old not in text:
              raise SystemExit("F2 exact-branch check not found")
          f2.write_text(text.replace(old, new))

          f8 = Path("scripts/audit-f8-content-pages.mjs")
          text = f8.read_text()
          text = text.replace(
              'const BRANCH = "phase/sole-f8-content-pages";\n',
              'const OWNER_BRANCH = "phase/sole-f8-content-pages";\n'
              'const INTEGRATION_BRANCH = "integration/sole-frontend-v2";\n'
              'const CONTROLLED_PHASE = /^phase\\/sole-f(?:\\d+)(?:-f\\d+)?-[a-z0-9-]+$/;\n'
              'const CONTROLLED_RELEASE = /^release\\/sole-frontend-v2(?:-|$)/;\n',
          )
          old = '''record("Expected branch", branch === BRANCH, {\n  expected: BRANCH,\n  actual: branch,\n  source: localBranch ? "git" : "ci-environment",\n});'''
          new = '''const controlledBranch =\n  branch === OWNER_BRANCH ||\n  branch === INTEGRATION_BRANCH ||\n  CONTROLLED_PHASE.test(branch) ||\n  CONTROLLED_RELEASE.test(branch);\nrecord("Controlled phase or integration branch", controlledBranch, {\n  owner: OWNER_BRANCH,\n  integration: INTEGRATION_BRANCH,\n  actual: branch,\n  source: localBranch ? "git" : "ci-environment",\n});'''
          if old not in text:
              raise SystemExit("F8 exact-branch check not found")
          f8.write_text(text.replace(old, new))

          acceptance = Path("docs/handoffs/F8-SUPERVISOR-ACCEPTANCE.md")
          text = acceptance.read_text()
          marker = "- Preserved the read-only shared CI workflow from Integration and removed every temporary write-enabled F8 workflow from the final tree.\n"
          addition = marker + "- Corrected inherited F2 and F8 audit branch policies so the same immutable checks remain valid on the owner phase branch, controlled later phase branches, Integration, and the release branch.\n"
          if "Corrected inherited F2 and F8 audit branch policies" not in text:
              text = text.replace(marker, addition)
          acceptance.write_text(text)
          PY

          bunx prettier --write \
            scripts/audit-f2-navigation-search.mjs \
            scripts/audit-f8-content-pages.mjs \
            docs/handoffs/F8-SUPERVISOR-ACCEPTANCE.md

      - name: Commit audit branch-policy correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/audit-f2-navigation-search.mjs \
            scripts/audit-f8-content-pages.mjs \
            docs/handoffs/F8-SUPERVISOR-ACCEPTANCE.md
          git commit -m "fix(audit): support controlled integration branches"
          git push origin HEAD:phase/sole-f8-content-pages
