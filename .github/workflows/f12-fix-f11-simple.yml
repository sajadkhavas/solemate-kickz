name: F12 Fix F11 Simple

on:
  push:
    branches:
      - phase/sole-f12-performance-media

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/sole-f12-performance-media
          fetch-depth: 0
      - name: Patch and push
        run: |
          python scripts/f12-fix-f11-downstream.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-f11-technical-seo.mjs
          git commit -m "Make accepted F11 formatter ownership downstream-safe"
          git push origin HEAD:phase/sole-f12-performance-media
