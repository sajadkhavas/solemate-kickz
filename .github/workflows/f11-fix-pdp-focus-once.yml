name: F11 fix PDP focus target once

on:
  push:
    branches:
      - phase/sole-f11-technical-seo

permissions:
  contents: write

concurrency:
  group: f11-fix-pdp-focus-once
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out F11 branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f11-technical-seo
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Remove duplicate PDP focus targets and harden proof
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          route_path = Path('src/routes/product.$id.tsx')
          route = route_path.read_text()
          route = route.replace(
              '''    <main\n      id="main-content"\n      tabIndex={-1}\n      className="flex min-h-screen items-center justify-center px-6 text-center"\n    >''',
              '''    <main className="flex min-h-screen items-center justify-center px-6 text-center">''',
          )
          route = route.replace(
              '''      <main\n        id="main-content"\n        tabIndex={-1}\n        className="mx-auto max-w-[1400px] px-4 pb-36 pt-8 sm:px-6 md:pb-16 lg:px-8"\n      >''',
              '''      <main className="mx-auto max-w-[1400px] px-4 pb-36 pt-8 sm:px-6 md:pb-16 lg:px-8">''',
          )
          if 'id="main-content"' in route:
              raise SystemExit('duplicate PDP main-content id still present')
          route_path.write_text(route)

          audit_path = Path('scripts/audit-f11-technical-seo.mjs')
          audit = audit_path.read_text()
          phase_anchor = '  "src/routes/products.tsx",\n'
          phase_line = '  "src/routes/product.$id.tsx",\n'
          if phase_line not in audit.split('const FORMAT_CLEANUP_FILES', 1)[0]:
              if phase_anchor not in audit:
                  raise SystemExit('PHASE_FILES route anchor missing')
              audit = audit.replace(phase_anchor, phase_line + phase_anchor, 1)

          record_anchor = '''record(\n  "invalid products use TanStack notFound semantics",\n  productRoute.includes("throw notFound()") && productRoute.includes("SHOES.find"),\n  null,\n);\n'''
          record = record_anchor + '''record(\n  "global skip target is unique and PDP keeps semantic main landmarks",\n  rootRoute.includes('href="#main-content"') &&\n    rootRoute.includes('id="main-content"') &&\n    !productRoute.includes('id="main-content"') &&\n    !productRoute.includes("tabIndex={-1}") &&\n    productRoute.includes("function ProductNotFound") &&\n    productRoute.includes("function ProductPage") &&\n    (productRoute.match(/<main/g) ?? []).length >= 2,\n  null,\n);\n'''
          if 'global skip target is unique and PDP keeps semantic main landmarks' not in audit:
              if record_anchor not in audit:
                  raise SystemExit('notFound audit anchor missing')
              audit = audit.replace(record_anchor, record, 1)
          audit_path.write_text(audit)
          PY

          bunx prettier --write 'src/routes/product.$id.tsx' scripts/audit-f11-technical-seo.mjs

      - name: Commit accessibility correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/product.$id.tsx' scripts/audit-f11-technical-seo.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Fix duplicate PDP main-content focus target"
          git push origin HEAD:phase/sole-f11-technical-seo
