name: P00 Targeted Closure Diagnostic

on:
  push:
    branches:
      - phase/p00-format-diagnostic-20260820
    paths:
      - .github/workflows/p00-targeted-closure-diagnostic.yml

permissions:
  contents: write

jobs:
  targeted-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - name: Install from lockfile
        run: bun install --frozen-lockfile
      - name: Stress instrumented catalog submit
        shell: bash
        run: |
          set -Eeuo pipefail
          stage=PATCH
          : > /tmp/p00-stage.log
          fail() {
            code=$?
            details="$(tail -n 120 /tmp/p00-stage.log 2>/dev/null || true)"
            git reset --hard HEAD >/dev/null 2>&1 || true
            mkdir -p .tmp-p00-diagnostic
            {
              printf 'FAIL:%s\n' "$stage"
              printf '%s\n' "$details"
            } > .tmp-p00-diagnostic/closure-status.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- .tmp-p00-diagnostic/closure-status.txt
            git commit -m "test(p00): capture catalog submit race at $stage" >/dev/null 2>&1 || true
            git push origin HEAD:phase/p00-format-diagnostic-20260820 >/dev/null 2>&1 || true
            exit "$code"
          }
          trap fail ERR

          python3 - <<'PY'
          from pathlib import Path

          products = Path('src/routes/products.tsx')
          source = products.read_text()
          source = source.replace(
              'import { useEffect, useMemo, useState, type FormEvent } from "react";',
              'import { useEffect, useMemo, useRef, useState, type FormEvent } from "react";',
              1,
          )
          old = '''  const [localQuery, setLocalQuery] = useState(search.q ?? "");\n\n  useEffect(() => setLocalQuery(search.q ?? ""), [search.q]);'''
          new = '''  const searchQuery = search.q ?? "";\n  const [localQuery, setLocalQuery] = useState(searchQuery);\n  const lastSearchQueryRef = useRef(searchQuery);\n\n  useEffect(() => {\n    if (lastSearchQueryRef.current === searchQuery) return;\n    lastSearchQueryRef.current = searchQuery;\n    setLocalQuery(searchQuery);\n  }, [searchQuery]);'''
          if old in source:
              source = source.replace(old, new, 1)
          source = source.replace(
              '''    const submittedQuery =\n      event.currentTarget.querySelector<HTMLInputElement>("#catalog-search")?.value ?? localQuery;\n    updateSearch({ q: submittedQuery.trim() || undefined });''',
              '''    const submittedQuery =\n      event.currentTarget.querySelector<HTMLInputElement>("#catalog-search")?.value ?? localQuery;\n    event.currentTarget.dataset.lastSubmittedQuery = submittedQuery;\n    updateSearch({ q: submittedQuery.trim() || undefined });''',
              1,
          )
          source = source.replace(
              '''          <form\n            onSubmit={submitSearch}\n            className="mt-6 grid max-w-2xl gap-2 sm:grid-cols-[1fr_auto]"''',
              '''          <form\n            onSubmit={submitSearch}\n            data-debug-local-query={localQuery}\n            data-debug-search-query={searchQuery}\n            className="mt-6 grid max-w-2xl gap-2 sm:grid-cols-[1fr_auto]"''',
              1,
          )
          products.write_text(source)

          test = Path('scripts/test-f4-f5-catalog-product-card.mjs')
          source = test.read_text()
          old = '''    await waitForExpression(client, `new URLSearchParams(location.search).get('q') === 'Nike'`);'''
          new = '''    try {\n      await waitForExpression(client, `new URLSearchParams(location.search).get('q') === 'Nike'`);\n    } catch (error) {\n      const debug = await evaluate(\n        client,\n        `(() => {\n          const input = document.querySelector('#catalog-search');\n          const form = input?.closest('form');\n          const button = form?.querySelector('button[type="submit"]');\n          return {\n            inputValue: input instanceof HTMLInputElement ? input.value : null,\n            inputAttribute: input?.getAttribute('value'),\n            localQuery: form?.getAttribute('data-debug-local-query'),\n            searchQuery: form?.getAttribute('data-debug-search-query'),\n            lastSubmittedQuery: form?.getAttribute('data-last-submitted-query'),\n            locationSearch: location.search,\n            hydrated: document.documentElement.dataset.soleHydrated,\n            activeId: document.activeElement?.id ?? null,\n            submitDisabled: button instanceof HTMLButtonElement ? button.disabled : null,\n          };\n        })()`,\n      );\n      throw new Error(`${error instanceof Error ? error.message : String(error)} DEBUG=${JSON.stringify(debug)}`);\n    }'''
          if old not in source:
              raise SystemExit('F4 wait target not found')
          test.write_text(source.replace(old, new, 1))
          PY

          ./node_modules/.bin/prettier --write src/routes/products.tsx scripts/test-f4-f5-catalog-product-card.mjs
          for i in 1 2 3 4 5 6; do
            stage="F4_INSTRUMENTED_${i}"
            : > /tmp/p00-stage.log
            bun run test:f4-f5 2>&1 | tee /tmp/p00-stage.log
          done

          git reset --hard HEAD >/dev/null 2>&1
          mkdir -p .tmp-p00-diagnostic
          printf 'PASS:F4_INSTRUMENTED_6X\n' > .tmp-p00-diagnostic/closure-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .tmp-p00-diagnostic/closure-status.txt
          git commit -m 'test(p00): record six stable instrumented F4 runs' >/dev/null 2>&1 || true
          git push origin HEAD:phase/p00-format-diagnostic-20260820 >/dev/null 2>&1 || true
