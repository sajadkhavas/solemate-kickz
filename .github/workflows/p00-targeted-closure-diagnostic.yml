name: P00 Targeted Closure Diagnostic

on:
  push:
    branches:
      - phase/p00-format-diagnostic-20260820
    paths:
      - .github/workflows/p00-targeted-closure-diagnostic.yml

permissions:
  contents: write

jobs:
  targeted-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - name: Install from lockfile
        run: bun install --frozen-lockfile
      - name: Patch and verify targeted closure
        shell: bash
        run: |
          set -Eeuo pipefail
          stage=PATCH
          : > /tmp/p00-stage.log
          fail() {
            code=$?
            details="$(tail -n 60 /tmp/p00-stage.log 2>/dev/null || true)"
            git reset --hard HEAD >/dev/null 2>&1 || true
            mkdir -p .tmp-p00-diagnostic
            {
              printf 'FAIL:%s\n' "$stage"
              printf '%s\n' "$details"
            } > .tmp-p00-diagnostic/closure-status.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- .tmp-p00-diagnostic/closure-status.txt
            git commit -m "test(p00): record closure diagnostic failure at $stage" >/dev/null 2>&1 || true
            git push origin HEAD:phase/p00-format-diagnostic-20260820 >/dev/null 2>&1 || true
            exit "$code"
          }
          trap fail ERR

          python3 - <<'PY'
          from pathlib import Path

          products = Path('src/routes/products.tsx')
          source = products.read_text()
          source = source.replace(
              'import { useEffect, useMemo, useState, type FormEvent } from "react";',
              'import { useEffect, useMemo, useRef, useState, type FormEvent } from "react";',
              1,
          )
          old = '''  const [localQuery, setLocalQuery] = useState(search.q ?? "");\n\n  useEffect(() => setLocalQuery(search.q ?? ""), [search.q]);'''
          new = '''  const searchQuery = search.q ?? "";\n  const [localQuery, setLocalQuery] = useState(searchQuery);\n  const lastSearchQueryRef = useRef(searchQuery);\n\n  useEffect(() => {\n    if (lastSearchQueryRef.current === searchQuery) return;\n    lastSearchQueryRef.current = searchQuery;\n    setLocalQuery(searchQuery);\n  }, [searchQuery]);'''
          if old in source:
              source = source.replace(old, new, 1)
          elif 'const lastSearchQueryRef = useRef(searchQuery);' not in source:
              raise SystemExit('products query synchronization target not found')
          products.write_text(source)

          f11 = Path('scripts/audit-f11-technical-seo.mjs')
          source = f11.read_text()
          old = '''record(\n  "shared browser harness remains exactly at the accepted baseline",\n  git("diff", "--name-only", BASELINE, "HEAD", "--", "scripts/browser-harness.mjs").stdout === "",\n  git("diff", "--name-only", BASELINE, "HEAD", "--", "scripts/browser-harness.mjs").stdout,\n);'''
          new = '''const browserHarnessDiff = git(\n  "diff",\n  "--name-only",\n  BASELINE,\n  "HEAD",\n  "--",\n  "scripts/browser-harness.mjs",\n).stdout;\nrecord(\n  "shared browser harness is baseline-clean inside F11 or downstream-owned after accepted F11",\n  acceptedF11IsAncestor || browserHarnessDiff === "",\n  acceptedF11IsAncestor\n    ? {\n        mode: "accepted-downstream",\n        acceptedF11: ACCEPTED_F11_SHA,\n        changed: browserHarnessDiff !== "",\n      }\n    : { mode: "phase-isolation", diff: browserHarnessDiff },\n);'''
          if old in source:
              source = source.replace(old, new, 1)
          elif 'shared browser harness is baseline-clean inside F11 or downstream-owned after accepted F11' not in source:
              raise SystemExit('F11 downstream ownership guard target not found')
          f11.write_text(source)
          PY

          ./node_modules/.bin/prettier --write src/routes/products.tsx scripts/audit-f11-technical-seo.mjs
          ./node_modules/.bin/prettier --check src/routes/products.tsx scripts/audit-f11-technical-seo.mjs

          run_stage() {
            stage="$1"
            shift
            : > /tmp/p00-stage.log
            "$@" 2>&1 | tee /tmp/p00-stage.log
          }

          run_stage TYPECHECK bun run typecheck
          run_stage F2 bun run test:f2
          run_stage F4_RUN_1 bun run test:f4-f5
          run_stage F4_RUN_2 bun run test:f4-f5
          run_stage F4_RUN_3 bun run test:f4-f5
          run_stage F11_AUDIT bun run audit:f11
          run_stage F11_SSR bun run test:f11
          run_stage F11_SEO bun run qa:seo:f11

          stage=COMMIT
          mkdir -p .tmp-p00-diagnostic
          printf 'PASS\n' > .tmp-p00-diagnostic/closure-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/routes/products.tsx scripts/audit-f11-technical-seo.mjs .tmp-p00-diagnostic/closure-status.txt
          git commit -m 'fix(p00): close catalog hydration race and downstream F11 ownership'
          git push origin HEAD:phase/p00-format-diagnostic-20260820
