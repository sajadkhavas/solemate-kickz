name: P00 Targeted Closure Diagnostic

on:
  push:
    branches:
      - phase/p00-format-diagnostic-20260820
    paths:
      - .github/workflows/p00-targeted-closure-diagnostic.yml

permissions:
  contents: write

jobs:
  targeted-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - name: Install from lockfile
        run: bun install --frozen-lockfile
      - name: Instrument F4 submit chain
        shell: bash
        run: |
          set -Eeuo pipefail
          stage=PATCH
          : > /tmp/p00-stage.log
          fail() {
            code=$?
            details="$(tail -n 140 /tmp/p00-stage.log 2>/dev/null || true)"
            git reset --hard HEAD >/dev/null 2>&1 || true
            mkdir -p .tmp-p00-diagnostic
            {
              printf 'FAIL:%s\n' "$stage"
              printf '%s\n' "$details"
            } > .tmp-p00-diagnostic/closure-status.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- .tmp-p00-diagnostic/closure-status.txt
            git commit -m "test(p00): capture F4 event chain at $stage" >/dev/null 2>&1 || true
            git push origin HEAD:phase/p00-format-diagnostic-20260820 >/dev/null 2>&1 || true
            exit "$code"
          }
          trap fail ERR

          python3 - <<'PY'
          from pathlib import Path
          test = Path('scripts/test-f4-f5-catalog-product-card.mjs')
          source = test.read_text()
          source = source.replace(
              '''    await waitForExpression(\n      client,\n      `document.querySelectorAll('[data-testid="product-card"]').length > 0`,\n    );''',
              '''    await waitForExpression(\n      client,\n      `document.querySelectorAll('[data-testid="product-card"]').length > 10`,\n    );''',
              1,
          )
          old = '''    await setInput(client, "#catalog-search", "Nike");\n    await click(client, 'form:has(#catalog-search) button[type="submit"]');\n    await waitForExpression(client, `new URLSearchParams(location.search).get('q') === 'Nike'`);'''
          new = '''    await setInput(client, "#catalog-search", "Nike");\n    await waitForExpression(\n      client,\n      `document.activeElement === document.querySelector('#catalog-search') && document.querySelector('#catalog-search')?.value === 'Nike'`,\n    );\n    await evaluate(\n      client,\n      `(() => {\n        const input = document.querySelector('#catalog-search');\n        const form = input?.closest('form');\n        window.__p00F4 = { keydowns: 0, submits: 0, submitValue: null };\n        input?.addEventListener('keydown', () => { window.__p00F4.keydowns += 1; }, { once: false });\n        form?.addEventListener('submit', () => {\n          window.__p00F4.submits += 1;\n          window.__p00F4.submitValue = input instanceof HTMLInputElement ? input.value : null;\n        }, { once: false });\n        return true;\n      })()`,\n    );\n    await client.send("Input.dispatchKeyEvent", {\n      type: "keyDown",\n      key: "Enter",\n      code: "Enter",\n      windowsVirtualKeyCode: 13,\n    });\n    await client.send("Input.dispatchKeyEvent", {\n      type: "keyUp",\n      key: "Enter",\n      code: "Enter",\n      windowsVirtualKeyCode: 13,\n    });\n    try {\n      await waitForExpression(client, `new URLSearchParams(location.search).get('q') === 'Nike'`);\n    } catch (error) {\n      const debug = await evaluate(\n        client,\n        `(() => {\n          const input = document.querySelector('#catalog-search');\n          const form = input?.closest('form');\n          return {\n            inputValue: input instanceof HTMLInputElement ? input.value : null,\n            activeId: document.activeElement?.id ?? null,\n            locationSearch: location.search,\n            events: window.__p00F4 ?? null,\n            formConnected: Boolean(form?.isConnected),\n            hydrated: document.documentElement.dataset.soleHydrated,\n          };\n        })()`,\n      );\n      throw new Error(`${error instanceof Error ? error.message : String(error)} DEBUG=${JSON.stringify(debug)}`);\n    }'''
          if old not in source:
              raise SystemExit('F4 original submit block not found')
          test.write_text(source.replace(old, new, 1))
          PY

          ./node_modules/.bin/prettier --write scripts/test-f4-f5-catalog-product-card.mjs
          for i in 1 2 3; do
            stage="F4_EVENT_${i}"
            : > /tmp/p00-stage.log
            bun run test:f4-f5 2>&1 | tee /tmp/p00-stage.log
          done

          git reset --hard HEAD >/dev/null 2>&1
          mkdir -p .tmp-p00-diagnostic
          printf 'PASS:F4_EVENT_3X\n' > .tmp-p00-diagnostic/closure-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .tmp-p00-diagnostic/closure-status.txt
          git commit -m 'test(p00): record F4 event-chain pass' >/dev/null 2>&1 || true
          git push origin HEAD:phase/p00-format-diagnostic-20260820 >/dev/null 2>&1 || true
