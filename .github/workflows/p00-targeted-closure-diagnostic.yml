name: P00 Targeted Closure Diagnostic

on:
  push:
    branches:
      - phase/p00-format-diagnostic-20260820
    paths:
      - .github/workflows/p00-targeted-closure-diagnostic.yml

permissions:
  contents: write

jobs:
  targeted-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - name: Install from lockfile
        run: bun install --frozen-lockfile
      - name: Validate final closure patches
        shell: bash
        run: |
          set -Eeuo pipefail
          stage=PATCH
          : > /tmp/p00-stage.log
          fail() {
            code=$?
            details="$(tail -n 140 /tmp/p00-stage.log 2>/dev/null || true)"
            git reset --hard HEAD >/dev/null 2>&1 || true
            mkdir -p .tmp-p00-diagnostic
            {
              printf 'FAIL:%s\n' "$stage"
              printf '%s\n' "$details"
            } > .tmp-p00-diagnostic/closure-status.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- .tmp-p00-diagnostic/closure-status.txt
            git commit -m "test(p00): record final closure failure at $stage" >/dev/null 2>&1 || true
            git push origin HEAD:phase/p00-format-diagnostic-20260820 >/dev/null 2>&1 || true
            exit "$code"
          }
          trap fail ERR

          python3 - <<'PY'
          from pathlib import Path

          f2 = Path('scripts/test-f2-navigation-search.mjs')
          source = f2.read_text()
          source = source.replace(
              '''    await waitForExpression(\n      client,\n      `!document.querySelector('[data-testid="desktop-menu-content"]')`,\n    );\n    const desktopClosed = await evaluate(''',
              '''    await waitForExpression(\n      client,\n      `!document.querySelector('[data-testid="desktop-menu-content"]')`,\n    );\n    await waitForExpression(\n      client,\n      `document.activeElement?.dataset.testid === "desktop-menu-trigger"`,\n    );\n    const desktopClosed = await evaluate(''',
              1,
          )
          source = source.replace(
              '''    await waitForExpression(client, `!${bodyLockedExpression}`);\n    const mobileClosed = await evaluate(''',
              '''    await waitForExpression(client, `!${bodyLockedExpression}`);\n    await waitForExpression(\n      client,\n      `document.activeElement?.dataset.testid === "mobile-menu-trigger"`,\n    );\n    const mobileClosed = await evaluate(''',
              1,
          )
          source = source.replace(
              '''    await waitForExpression(client, `document.querySelector('[aria-label="پاک‌کردن جستجو"]')`);\n    await visibleClick(client, '[aria-label="پاک‌کردن جستجو"]');''',
              '''    await waitForExpression(\n      client,\n      `(() => {\n        const input = document.querySelector('[data-testid="search-input"]');\n        const target = document.querySelector('[aria-label="پاک‌کردن جستجو"]');\n        if (!(input instanceof HTMLInputElement) || !(target instanceof HTMLButtonElement)) return false;\n        const style = getComputedStyle(target);\n        const rect = target.getBoundingClientRect();\n        return input.value === 'Jordan' && !target.disabled && style.display !== 'none' &&\n          style.visibility !== 'hidden' && style.pointerEvents !== 'none' && rect.width > 0 && rect.height > 0;\n      })()`,\n    );\n    await visibleClick(client, '[aria-label="پاک‌کردن جستجو"]');''',
              1,
          )
          if 'document.activeElement?.dataset.testid === "desktop-menu-trigger"' not in source:
              raise SystemExit('F2 desktop focus patch missing')
          if 'document.activeElement?.dataset.testid === "mobile-menu-trigger"' not in source:
              raise SystemExit('F2 mobile focus patch missing')
          if "input.value === 'Jordan'" not in source:
              raise SystemExit('F2 clear readiness patch missing')
          f2.write_text(source)

          f4 = Path('scripts/test-f4-f5-catalog-product-card.mjs')
          source = f4.read_text()
          source = source.replace(
              '''    await waitForExpression(\n      client,\n      `document.querySelectorAll('[data-testid="product-card"]').length > 0`,\n    );''',
              '''    await waitForExpression(\n      client,\n      `document.querySelectorAll('[data-testid="product-card"]').length > 10`,\n    );''',
              1,
          )
          source = source.replace(
              '''    await setInput(client, "#catalog-search", "Nike");\n    await click(client, 'form:has(#catalog-search) button[type="submit"]');\n    await waitForExpression(client, `new URLSearchParams(location.search).get('q') === 'Nike'`);''',
              '''    await setInput(client, "#catalog-search", "Nike");\n    await waitForExpression(\n      client,\n      `document.querySelector('#catalog-search')?.value === 'Nike'`,\n    );\n    const submitted = await evaluate(\n      client,\n      `(() => {\n        const input = document.querySelector('#catalog-search');\n        const form = input?.closest('form');\n        const button = form?.querySelector('button[type="submit"]');\n        if (!(form instanceof HTMLFormElement) || !(button instanceof HTMLButtonElement)) return false;\n        form.requestSubmit(button);\n        return true;\n      })()`,\n    );\n    if (!submitted) throw new Error("Catalog search form could not be submitted");\n    await waitForExpression(client, `new URLSearchParams(location.search).get('q') === 'Nike'`);''',
              1,
          )
          if 'form.requestSubmit(button);' not in source:
              raise SystemExit('F4 requestSubmit patch missing')
          f4.write_text(source)

          f11 = Path('scripts/audit-f11-technical-seo.mjs')
          source = f11.read_text()
          source = source.replace(
              '''record(\n  "shared browser harness remains exactly at the accepted baseline",\n  git("diff", "--name-only", BASELINE, "HEAD", "--", "scripts/browser-harness.mjs").stdout === "",\n  git("diff", "--name-only", BASELINE, "HEAD", "--", "scripts/browser-harness.mjs").stdout,\n);''',
              '''const browserHarnessDiff = git(\n  "diff",\n  "--name-only",\n  BASELINE,\n  "HEAD",\n  "--",\n  "scripts/browser-harness.mjs",\n).stdout;\nrecord(\n  "shared browser harness is baseline-clean inside F11 or downstream-owned after accepted F11",\n  acceptedF11IsAncestor || browserHarnessDiff === "",\n  acceptedF11IsAncestor\n    ? {\n        mode: "accepted-downstream",\n        acceptedF11: ACCEPTED_F11_SHA,\n        changed: browserHarnessDiff !== "",\n      }\n    : { mode: "phase-isolation", diff: browserHarnessDiff },\n);''',
              1,
          )
          if 'shared browser harness is baseline-clean inside F11 or downstream-owned after accepted F11' not in source:
              raise SystemExit('F11 downstream ownership patch missing')
          f11.write_text(source)
          PY

          ./node_modules/.bin/prettier --write scripts/test-f2-navigation-search.mjs scripts/test-f4-f5-catalog-product-card.mjs scripts/audit-f11-technical-seo.mjs
          ./node_modules/.bin/prettier --check scripts/test-f2-navigation-search.mjs scripts/test-f4-f5-catalog-product-card.mjs scripts/audit-f11-technical-seo.mjs

          run_stage() {
            stage="$1"
            shift
            : > /tmp/p00-stage.log
            "$@" 2>&1 | tee /tmp/p00-stage.log
          }

          run_stage TYPECHECK bun run typecheck
          run_stage F2_RUN_1 bun run test:f2
          run_stage F2_RUN_2 bun run test:f2
          run_stage F2_RUN_3 bun run test:f2
          run_stage F2_RUN_4 bun run test:f2
          run_stage F4_RUN_1 bun run test:f4-f5
          run_stage F4_RUN_2 bun run test:f4-f5
          run_stage F4_RUN_3 bun run test:f4-f5
          run_stage F4_RUN_4 bun run test:f4-f5
          run_stage F4_RUN_5 bun run test:f4-f5
          run_stage F4_RUN_6 bun run test:f4-f5
          run_stage F11_AUDIT bun run audit:f11
          run_stage F11_SSR bun run test:f11
          run_stage F11_SEO bun run qa:seo:f11

          stage=COMMIT
          mkdir -p .tmp-p00-diagnostic
          printf 'PASS:FINAL_TARGETED_CLOSURE\n' > .tmp-p00-diagnostic/closure-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/test-f2-navigation-search.mjs scripts/test-f4-f5-catalog-product-card.mjs scripts/audit-f11-technical-seo.mjs .tmp-p00-diagnostic/closure-status.txt
          git commit -m 'test(p00): stabilize inherited browser and F11 contracts'
          git push origin HEAD:phase/p00-format-diagnostic-20260820
