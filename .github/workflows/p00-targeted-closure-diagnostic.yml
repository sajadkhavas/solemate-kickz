name: P00 Targeted Closure Diagnostic

on:
  push:
    branches:
      - phase/p00-format-diagnostic-20260820
    paths:
      - .github/workflows/p00-targeted-closure-diagnostic.yml

permissions:
  contents: write

jobs:
  targeted-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - name: Install from lockfile
        run: bun install --frozen-lockfile
      - name: Validate deterministic browser closure
        shell: bash
        run: |
          set -Eeuo pipefail
          stage=PATCH
          : > /tmp/p00-stage.log
          fail() {
            code=$?
            details="$(tail -n 100 /tmp/p00-stage.log 2>/dev/null || true)"
            git reset --hard HEAD >/dev/null 2>&1 || true
            mkdir -p .tmp-p00-diagnostic
            {
              printf 'FAIL:%s\n' "$stage"
              printf '%s\n' "$details"
            } > .tmp-p00-diagnostic/closure-status.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- .tmp-p00-diagnostic/closure-status.txt
            git commit -m "test(p00): record deterministic closure failure at $stage" >/dev/null 2>&1 || true
            git push origin HEAD:phase/p00-format-diagnostic-20260820 >/dev/null 2>&1 || true
            exit "$code"
          }
          trap fail ERR

          python3 - <<'PY'
          from pathlib import Path

          f2 = Path('scripts/test-f2-navigation-search.mjs')
          source = f2.read_text()
          desktop_old = '''    await waitForExpression(\n      client,\n      `!document.querySelector('[data-testid="desktop-menu-content"]')`,\n    );\n    const desktopClosed = await evaluate('''
          desktop_new = '''    await waitForExpression(\n      client,\n      `!document.querySelector('[data-testid="desktop-menu-content"]')`,\n    );\n    await waitForExpression(\n      client,\n      `document.activeElement?.dataset.testid === "desktop-menu-trigger"`,\n    );\n    const desktopClosed = await evaluate('''
          if desktop_old in source:
              source = source.replace(desktop_old, desktop_new, 1)
          elif 'document.activeElement?.dataset.testid === "desktop-menu-trigger"' not in source:
              raise SystemExit('F2 desktop focus target not found')

          mobile_old = '''    await waitForExpression(client, `!${bodyLockedExpression}`);\n    const mobileClosed = await evaluate('''
          mobile_new = '''    await waitForExpression(client, `!${bodyLockedExpression}`);\n    await waitForExpression(\n      client,\n      `document.activeElement?.dataset.testid === "mobile-menu-trigger"`,\n    );\n    const mobileClosed = await evaluate('''
          if mobile_old in source:
              source = source.replace(mobile_old, mobile_new, 1)
          elif 'document.activeElement?.dataset.testid === "mobile-menu-trigger"' not in source:
              raise SystemExit('F2 mobile focus target not found')
          f2.write_text(source)

          f4 = Path('scripts/test-f4-f5-catalog-product-card.mjs')
          source = f4.read_text()
          old_wait = '''    await waitForExpression(\n      client,\n      `document.querySelectorAll('[data-testid="product-card"]').length > 0`,\n    );'''
          new_wait = '''    await waitForExpression(\n      client,\n      `document.querySelectorAll('[data-testid="product-card"]').length > 10`,\n    );'''
          if old_wait in source:
              source = source.replace(old_wait, new_wait, 1)
          elif "document.querySelectorAll('[data-testid=\"product-card\"]').length > 10" not in source:
              raise SystemExit('F4 catalog readiness target not found')

          old_submit = '''    await setInput(client, "#catalog-search", "Nike");\n    await click(client, 'form:has(#catalog-search) button[type="submit"]');\n    await waitForExpression(client, `new URLSearchParams(location.search).get('q') === 'Nike'`);'''
          new_submit = '''    await setInput(client, "#catalog-search", "Nike");\n    await waitForExpression(\n      client,\n      `document.activeElement === document.querySelector('#catalog-search') && document.querySelector('#catalog-search')?.value === 'Nike'`,\n    );\n    await client.send("Input.dispatchKeyEvent", {\n      type: "keyDown",\n      key: "Enter",\n      code: "Enter",\n      windowsVirtualKeyCode: 13,\n    });\n    await client.send("Input.dispatchKeyEvent", {\n      type: "keyUp",\n      key: "Enter",\n      code: "Enter",\n      windowsVirtualKeyCode: 13,\n    });\n    await waitForExpression(client, `new URLSearchParams(location.search).get('q') === 'Nike'`);'''
          if old_submit in source:
              source = source.replace(old_submit, new_submit, 1)
          elif 'windowsVirtualKeyCode: 13' not in source:
              raise SystemExit('F4 keyboard submit target not found')
          f4.write_text(source)

          f11 = Path('scripts/audit-f11-technical-seo.mjs')
          source = f11.read_text()
          old = '''record(\n  "shared browser harness remains exactly at the accepted baseline",\n  git("diff", "--name-only", BASELINE, "HEAD", "--", "scripts/browser-harness.mjs").stdout === "",\n  git("diff", "--name-only", BASELINE, "HEAD", "--", "scripts/browser-harness.mjs").stdout,\n);'''
          new = '''const browserHarnessDiff = git(\n  "diff",\n  "--name-only",\n  BASELINE,\n  "HEAD",\n  "--",\n  "scripts/browser-harness.mjs",\n).stdout;\nrecord(\n  "shared browser harness is baseline-clean inside F11 or downstream-owned after accepted F11",\n  acceptedF11IsAncestor || browserHarnessDiff === "",\n  acceptedF11IsAncestor\n    ? {\n        mode: "accepted-downstream",\n        acceptedF11: ACCEPTED_F11_SHA,\n        changed: browserHarnessDiff !== "",\n      }\n    : { mode: "phase-isolation", diff: browserHarnessDiff },\n);'''
          if old in source:
              source = source.replace(old, new, 1)
          elif 'shared browser harness is baseline-clean inside F11 or downstream-owned after accepted F11' not in source:
              raise SystemExit('F11 downstream ownership guard target not found')
          f11.write_text(source)
          PY

          ./node_modules/.bin/prettier --write scripts/test-f2-navigation-search.mjs scripts/test-f4-f5-catalog-product-card.mjs scripts/audit-f11-technical-seo.mjs
          ./node_modules/.bin/prettier --check scripts/test-f2-navigation-search.mjs scripts/test-f4-f5-catalog-product-card.mjs scripts/audit-f11-technical-seo.mjs

          run_stage() {
            stage="$1"
            shift
            : > /tmp/p00-stage.log
            "$@" 2>&1 | tee /tmp/p00-stage.log
          }

          run_stage TYPECHECK bun run typecheck
          run_stage F2_RUN_1 bun run test:f2
          run_stage F2_RUN_2 bun run test:f2
          run_stage F2_RUN_3 bun run test:f2
          run_stage F4_RUN_1 bun run test:f4-f5
          run_stage F4_RUN_2 bun run test:f4-f5
          run_stage F4_RUN_3 bun run test:f4-f5
          run_stage F4_RUN_4 bun run test:f4-f5
          run_stage F11_AUDIT bun run audit:f11
          run_stage F11_SSR bun run test:f11
          run_stage F11_SEO bun run qa:seo:f11

          stage=COMMIT
          mkdir -p .tmp-p00-diagnostic
          printf 'PASS:DETERMINISTIC_CLOSURE\n' > .tmp-p00-diagnostic/closure-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/test-f2-navigation-search.mjs scripts/test-f4-f5-catalog-product-card.mjs scripts/audit-f11-technical-seo.mjs .tmp-p00-diagnostic/closure-status.txt
          git commit -m 'test(p00): stabilize inherited browser readiness contracts'
          git push origin HEAD:phase/p00-format-diagnostic-20260820
