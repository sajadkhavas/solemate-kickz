name: F0/F1 Artifact Maintenance

on:
  push:
    branches:
      - phase/sole-f0-f1-foundation
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete obsolete F0/F1 artifacts only
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );

            const managedName = /^(?:f0-f1-|frontend-quality-)/;
            const managed = artifacts.filter((artifact) => managedName.test(artifact.name));

            core.info(`Found ${managed.length} managed F0/F1 artifacts.`);
            for (const artifact of managed) {
              core.info(`Deleting ${artifact.id}: ${artifact.name}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

            core.summary
              .addHeading('F0/F1 artifact maintenance')
              .addRaw(`Deleted ${managed.length} obsolete managed artifacts.`)
              .write();
