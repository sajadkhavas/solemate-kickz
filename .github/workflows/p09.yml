name: P09 loyalty CRM notifications gate

on:
  pull_request:
  push:
    branches:
      - "phase/**"

permissions:
  contents: read

concurrency:
  group: p09-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p09:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: P09 source audit
        run: node scripts/audit-p09-loyalty-crm-notifications.mjs
      - name: P09 adversarial source contracts
        run: node scripts/test-p09-loyalty-crm-notifications.mjs
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Emit exact lockfile-Prettier payload
        shell: bash
        run: |
          set -Eeuo pipefail
          files=(
            scripts/audit-p09-loyalty-crm-notifications.mjs
            scripts/test-p09-loyalty-crm-notifications.mjs
            src/engagement/production-wishlist-store.ts
            src/engagement/ProductionWishlistPage.tsx
            src/engagement/ProductionShoeCard.tsx
            src/engagement/ProductionNotificationCenter.tsx
            src/engagement/ProductionLoyaltyPage.tsx
          )
          bunx prettier --write "${files[@]}"
          for file in "${files[@]}"; do
            echo "P09_FORMATTED_BEGIN=${file}"
            base64 -w0 "$file"
            echo
            echo "P09_FORMATTED_END=${file}"
          done
          git diff --exit-code -- "${files[@]}"
      - name: Production build
        run: bun run build
      - name: Preserve fixed F12 performance budget
        run: bun run qa:perf:f12
