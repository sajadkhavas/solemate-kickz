name: P09 loyalty CRM notifications gate

on:
  pull_request:
  push:
    branches:
      - "phase/**"

permissions:
  contents: read

concurrency:
  group: p09-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p09:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: P09 source audit
        run: node scripts/audit-p09-loyalty-crm-notifications.mjs
      - name: P09 adversarial source contracts
        run: node scripts/test-p09-loyalty-crm-notifications.mjs
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: P09 format check
        run: >-
          bunx prettier --check
          .github/workflows/p09.yml
          scripts/audit-p09-loyalty-crm-notifications.mjs
          scripts/test-p09-loyalty-crm-notifications.mjs
          src/engagement/engagement-api.ts
          src/engagement/engagement-proxy.server.ts
          src/engagement/production-wishlist-store.ts
          src/engagement/ProductionWishlistPage.tsx
          src/engagement/ProductionShoeCard.tsx
          src/engagement/ProductionProductPurchasePanel.tsx
          src/engagement/ProductionNotificationCenter.tsx
          src/engagement/ProductionLoyaltyPage.tsx
          src/engagement/production-wishlist-route.tsx
          src/routes/api.engagement.$.ts
          src/auth/production-account-route.tsx
          src/auth/ProductionNavbar.tsx
          vite.config.ts
      - name: Production build
        run: bun run build
      - name: Preserve fixed F12 performance budget
        run: bun run qa:perf:f12
      - name: Verify clean tree
        run: test -z "$(git status --short)"
      - name: Upload P09 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p09-quality-evidence
          if-no-files-found: warn
          retention-days: 1
          path: artifacts/reports/p09-loyalty-crm-notifications-contract.json
