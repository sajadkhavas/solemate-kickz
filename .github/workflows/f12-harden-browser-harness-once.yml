name: F12 Harden Browser Harness Once

on:
  push:
    branches:
      - phase/sole-f12-performance-media

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/sole-f12-performance-media
          fetch-depth: 0
      - name: Patch and push
        run: |
          python scripts/f12-harden-browser-harness.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-f7-cart-checkout.mjs scripts/visual-qa-f2-navigation-search.mjs
          git commit -m "Harden inherited browser harness synchronization"
          git push origin HEAD:phase/sole-f12-performance-media
