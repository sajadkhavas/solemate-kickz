name: P00 Trusted Input Diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  trusted-input-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true
      - name: Install from lockfile
        run: bun install --frozen-lockfile
      - name: Materialize trusted CDP text input
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/browser-harness.mjs')
          source = path.read_text()
          start_marker = '  send(method, params = {}) {'
          end_marker = '\n  on(method, listener) {'
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('CdpClient.send start marker not found')
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('CdpClient.on boundary not found')
          new = '''  send(method, params = {}) {
            if (method === "Input.insertText" && typeof params.text === "string") {
              return this.insertText(params.text);
            }
            return this.sendRaw(method, params);
          }

          sendRaw(method, params = {}) {
            const id = ++this.sequence;
            return new Promise((resolve, reject) => {
              this.pending.set(id, { resolve, reject });
              this.socket.send(JSON.stringify({ id, method, params }));
            });
          }

          async insertText(text) {
            for (const character of text) {
              const upper = character.toUpperCase();
              const isLetter = /^[A-Za-z]$/.test(character);
              const isDigit = /^\\d$/.test(character);
              const windowsVirtualKeyCode = isLetter
                ? upper.charCodeAt(0)
                : isDigit
                  ? character.charCodeAt(0)
                  : character === " "
                    ? 32
                    : 0;
              const code = isLetter
                ? `Key${upper}`
                : isDigit
                  ? `Digit${character}`
                  : character === " "
                    ? "Space"
                    : "";

              await this.sendRaw("Input.dispatchKeyEvent", {
                type: "keyDown",
                key: character,
                code,
                text: character,
                unmodifiedText: character,
                windowsVirtualKeyCode,
              });
              await this.sendRaw("Input.dispatchKeyEvent", {
                type: "keyUp",
                key: character,
                code,
                windowsVirtualKeyCode,
              });
            }
            return {};
          }
          '''
          path.write_text(source[:start] + new + source[end:])
          PY
          ./node_modules/.bin/prettier --write scripts/browser-harness.mjs
      - name: Verify F2 without retry
        run: bun run test:f2
      - name: Verify F4-F5 without retry
        run: bun run test:f4-f5
      - name: Commit validated harness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/browser-harness.mjs
          git commit -m 'test(p00): use trusted CDP text input'
          git push origin HEAD:phase/p00-format-diagnostic-20260820
