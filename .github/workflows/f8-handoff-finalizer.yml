name: Temporary F8 Handoff Finalizer

on:
  push:
    branches:
      - "phase/sole-f8-content-pages"

permissions:
  contents: write

concurrency:
  group: temporary-f8-handoff-finalizer
  cancel-in-progress: true

jobs:
  patch-and-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out F8 branch
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f8-content-pages
          fetch-depth: 0

      - name: Align handoff with final implementation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("docs/handoffs/F8-CONTENT-PAGES.md")
          text = path.read_text()
          text = text.replace(
              "- Uses `BRAND_LOGO_SLUGS` where available and a textual fallback when a logo is missing or fails.",
              "- Uses deterministic local text marks derived from each real brand name; no external logo CDN or remote fallback is required.",
          )
          text = text.replace(
              "The branch was verified as identical to the Foundation SHA before implementation. No merge, force push, history rewrite, or secondary branch was used.",
              "The implementation started from the accepted Foundation SHA. During supervisor integration review, the approved F3 and F2 Integration baseline was merged non-destructively without force push or history rewrite.",
          )
          path.write_text(text)
          PY

      - name: Commit handoff alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/handoffs/F8-CONTENT-PAGES.md
          git commit -m "docs(handoff): align F8 brand evidence"
          git push origin HEAD:phase/sole-f8-content-pages
