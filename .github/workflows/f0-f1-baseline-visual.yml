name: F0/F1 Baseline Visual Evidence

on:
  push:
    branches:
      - phase/sole-f0-f1-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f0-f1-baseline-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-visual-evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out mission branch for QA runner
        uses: actions/checkout@v4
        with:
          ref: phase/sole-f0-f1-foundation
          path: mission
          fetch-depth: 1

      - name: Check out exact baseline
        uses: actions/checkout@v4
        with:
          ref: 137344f1d89373a55e3bf4bb4d82b48d8247b45f
          path: baseline
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install baseline from lockfile
        working-directory: baseline
        run: bun install --frozen-lockfile

      - name: Copy current QA runner without changing baseline source
        shell: bash
        run: |
          mkdir -p baseline/scripts
          cp mission/scripts/visual-qa-f0-f1.mjs baseline/scripts/visual-qa-f0-f1.mjs

      - name: Capture baseline screenshots and report
        working-directory: baseline
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/baseline-run
          bun run dev -- --host 127.0.0.1 --port 4174 > artifacts/baseline-run/server.txt 2>&1 &
          server_pid=$!
          ready=0

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4174/ > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ $ready -eq 1 ]]; then
            VISUAL_QA_BASE_URL=http://127.0.0.1:4174 \
            CHROME_DEBUG_PORT=9223 \
            node scripts/visual-qa-f0-f1.mjs \
              > artifacts/baseline-run/visual-qa.txt 2>&1
            visual_code=$?
          else
            visual_code=125
            echo "Baseline SSR server did not become ready." > artifacts/baseline-run/visual-qa.txt
          fi

          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true

          {
            echo "baseline=137344f1d89373a55e3bf4bb4d82b48d8247b45f"
            echo "visual_qa_raw_exit=$visual_code"
            echo "report_exists=$(test -f artifacts/visual-qa/f0-f1-visual-qa.json && echo yes || echo no)"
            echo "manifest_exists=$(test -f artifacts/visual-qa/manifest.txt && echo yes || echo no)"
          } > artifacts/baseline-run/status.txt

          cat artifacts/baseline-run/status.txt
          test -f artifacts/visual-qa/f0-f1-visual-qa.json
          test -f artifacts/visual-qa/manifest.txt

      - name: Upload exact baseline visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f0-f1-baseline-visual-qa
          if-no-files-found: error
          retention-days: 14
          path: |
            baseline/artifacts/visual-qa/screenshots/
            baseline/artifacts/visual-qa/f0-f1-visual-qa.json
            baseline/artifacts/visual-qa/manifest.txt
            baseline/artifacts/baseline-run/status.txt
            baseline/artifacts/baseline-run/server.txt
            baseline/artifacts/baseline-run/visual-qa.txt
