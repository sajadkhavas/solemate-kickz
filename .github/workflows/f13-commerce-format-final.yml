name: F13 Commerce Format Final

on:
  push:
    branches:
      - "phase/sole-f13-full-code-audit-hardening"

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: Show exact Prettier diff
        shell: bash
        run: |
          bunx prettier --write src/components/ui/commerce-primitives.tsx
          git --no-pager diff -- src/components/ui/commerce-primitives.tsx
