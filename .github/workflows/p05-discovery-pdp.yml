name: P05 Discovery PDP Gate

on:
  pull_request:
    paths:
      - "src/catalog/**"
      - "src/components/catalog/**"
      - "src/components/product/**"
      - "src/routes/products.tsx"
      - "src/routes/product.$id.tsx"
      - "src/routes/api.catalog.ts"
      - "scripts/audit-p05-discovery-pdp.mjs"
      - "scripts/test-p05-discovery-pdp.mjs"
      - "docs/handoffs/P05-DISCOVERY-PDP-CONVERSION.md"
      - "contracts/production-phase-registry.json"
      - ".github/workflows/p05-discovery-pdp.yml"
  push:
    branches:
      - "phase/sole-p05-*"

permissions:
  contents: write

concurrency:
  group: p05-discovery-pdp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p05:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
          no-cache: true

      - name: Install from lockfile
        run: bun install --frozen-lockfile

      - name: One-time exact formatter commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase/sole-p05-discovery-pdp-conversion'
        shell: bash
        run: |
          set -Eeuo pipefail
          allowed="$RUNNER_TEMP/p05-format-allowed.txt"
          actual="$RUNNER_TEMP/p05-format-actual.txt"
          cat >"$allowed" <<'EOF'
          scripts/audit-p05-discovery-pdp.mjs
          scripts/test-p05-discovery-pdp.mjs
          src/catalog/catalog-state.ts
          src/catalog/p05-discovery.server.ts
          src/catalog/production-catalog.ts
          src/components/product/ProductPurchasePanel.tsx
          src/routes/api.catalog.ts
          src/routes/product.$id.tsx
          src/routes/products.tsx
          EOF
          sort -o "$allowed" "$allowed"
          bunx prettier --write \
            scripts/audit-p05-discovery-pdp.mjs \
            scripts/test-p05-discovery-pdp.mjs \
            src/catalog/catalog-state.ts \
            src/catalog/p05-discovery.server.ts \
            src/catalog/production-catalog.ts \
            src/components/product/ProductPurchasePanel.tsx \
            src/routes/api.catalog.ts \
            src/routes/products.tsx \
            'src/routes/product.$id.tsx'
          git diff --name-only | sort >"$actual"
          if [[ ! -s "$actual" ]]; then
            echo "FORMATTER_CHANGE=NO"
            exit 0
          fi
          if [[ "$(cat "$actual")" != "$(cat "$allowed")" ]]; then
            echo "Unexpected formatter mutation set:" >&2
            cat "$actual" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            scripts/audit-p05-discovery-pdp.mjs \
            scripts/test-p05-discovery-pdp.mjs \
            src/catalog/catalog-state.ts \
            src/catalog/p05-discovery.server.ts \
            src/catalog/production-catalog.ts \
            src/components/product/ProductPurchasePanel.tsx \
            src/routes/api.catalog.ts \
            src/routes/products.tsx \
            'src/routes/product.$id.tsx'
          git commit -m "P05: apply exact locked Prettier output"
          git push origin HEAD:phase/sole-p05-discovery-pdp-conversion

      - name: P05 source contract audit
        run: node scripts/audit-p05-discovery-pdp.mjs

      - name: P05 browser behavior regression
        run: node scripts/qa/retry-gate.mjs -- node scripts/test-p05-discovery-pdp.mjs

      - name: P05 typecheck
        run: bun run typecheck

      - name: P05 lint
        run: bun run lint

      - name: P05 format check
        id: p05_format
        continue-on-error: true
        run: >-
          bunx prettier --check
          .github/workflows/p05-discovery-pdp.yml
          docs/handoffs/P05-DISCOVERY-PDP-CONVERSION.md
          scripts/audit-p05-discovery-pdp.mjs
          scripts/test-p05-discovery-pdp.mjs
          src/catalog/catalog-state.ts
          src/catalog/discovery-types.ts
          src/catalog/p05-discovery.server.ts
          src/catalog/production-catalog.ts
          src/components/catalog/CatalogFilters.tsx
          src/components/product/ProductPurchasePanel.tsx
          src/routes/api.catalog.ts
          src/routes/products.tsx
          'src/routes/product.$id.tsx'

      - name: Capture exact Prettier output when needed
        if: steps.p05_format.outcome == 'failure'
        shell: bash
        run: |
          set -Eeuo pipefail
          bunx prettier --write \
            scripts/audit-p05-discovery-pdp.mjs \
            scripts/test-p05-discovery-pdp.mjs \
            src/catalog/catalog-state.ts \
            src/catalog/p05-discovery.server.ts \
            src/catalog/production-catalog.ts \
            src/components/product/ProductPurchasePanel.tsx \
            src/routes/api.catalog.ts \
            src/routes/products.tsx \
            'src/routes/product.$id.tsx'
          mkdir -p artifacts/formatted-p05
          for file in \
            scripts/audit-p05-discovery-pdp.mjs \
            scripts/test-p05-discovery-pdp.mjs \
            src/catalog/catalog-state.ts \
            src/catalog/p05-discovery.server.ts \
            src/catalog/production-catalog.ts \
            src/components/product/ProductPurchasePanel.tsx \
            src/routes/api.catalog.ts \
            src/routes/products.tsx \
            'src/routes/product.$id.tsx'
          do
            mkdir -p "artifacts/formatted-p05/$(dirname "$file")"
            cp "$file" "artifacts/formatted-p05/$file"
          done

      - name: Enforce P05 format result
        if: steps.p05_format.outcome == 'failure'
        run: exit 1

      - name: Production build regression
        run: bun run build

      - name: P05 performance budget regression
        run: bun run qa:perf:f12

      - name: Upload P05 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p05-discovery-pdp-evidence
          overwrite: true
          compression-level: 9
          if-no-files-found: warn
          retention-days: 1
          path: |
            artifacts/reports/p05-discovery-pdp-behavior.json
            artifacts/runtime/p05-discovery-pdp-server.txt
            artifacts/runtime/p05-discovery-pdp-chrome.txt
            artifacts/formatted-p05/
